<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{TITLE}}</title>
<!-- catalogue --><!-- read by tools/catalogue.py; edit here, then rebuild -->
<meta name="sd:title" content="{{TITLE}}">
<meta name="sd:group" content="{{GROUP}}">
<meta name="sd:tone"  content="{{TONE}}">
<meta name="sd:icon"  content="{{ICON}}">
<meta name="sd:tag"   content="{{TAG}}">
<meta name="sd:line"  content="{{LINE}}">
<meta name="sd:cta"   content="{{CTA}}">
<meta name="sd:order" content="50">
<!-- /catalogue -->
<meta name="description" content="{{LINE}}">
<meta name="theme-color" content="#09090f">
{{ROBOTS}}
<link rel="icon" type="image/png" href="{{ASSETS}}/img/selfdriven-you-logo-round-4colour-wheel.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* the house palette — same tokens the index uses, so pages look like family */
:root{
  --bg:#09090f; --surface:#111118;
  --border:rgba(255,255,255,.08);
  --text:#f0eeff; --muted:#7e7a9a; --muted2:#3d3a55;
  --curious:#f5c842; --caring:#ff5f7e; --constructive:#00e5a0; --chill:#7b6cff;
  --chill-bright:#9b8fff; --gold:#e8b84b;
  --accent:var(--{{TONE_VAR}});
  --pill:999px;
}
html,body{background:var(--bg);color:var(--text)}
body{font-family:'DM Sans',sans-serif;line-height:1.7;overflow-x:hidden;
  min-height:100vh;display:flex;flex-direction:column}
a{color:var(--accent)}
::selection{background:var(--accent);color:#09090f}

.gblob{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
.gb1{width:420px;height:420px;background:var(--accent);top:-10%;left:-8%;opacity:.12}
.gb2{width:360px;height:360px;background:var(--chill);bottom:-14%;right:-10%;opacity:.14}

.wrap{position:relative;z-index:1;flex:1;width:100%;max-width:720px;margin:0 auto;
  padding:clamp(48px,9vw,96px) 24px 64px}

.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:32px;
  font-size:13px;color:var(--muted);text-decoration:none;transition:color .25s}
.back:hover{color:var(--text)}

.markdots{display:inline-flex;gap:5px;margin-bottom:20px}
.markdots i{width:9px;height:9px;border-radius:50%;display:block}
.markdots i:nth-child(1){background:var(--curious)}
.markdots i:nth-child(2){background:var(--caring)}
.markdots i:nth-child(3){background:var(--constructive)}
.markdots i:nth-child(4){background:var(--chill)}

.eyebrow{font-family:'Bricolage Grotesque',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
h1{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(34px,6.5vw,56px);
  font-weight:800;letter-spacing:-.045em;line-height:1.02;margin-bottom:16px}
.lede{font-size:clamp(16px,2.4vw,19px);color:var(--muted);margin-bottom:44px;max-width:52ch}

h2{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(21px,3.4vw,27px);
  font-weight:800;letter-spacing:-.03em;margin:44px 0 14px}
p{margin-bottom:18px;color:var(--text);opacity:.88}
ul,ol{margin:0 0 20px 22px}
li{margin-bottom:9px;opacity:.88}
strong{color:var(--text);opacity:1}

.card{padding:26px 24px;border:1px solid var(--border);border-radius:20px;
  background:var(--surface);margin:26px 0}
.rule{height:1px;background:var(--border);margin:40px 0;border:0}

footer{position:relative;z-index:1;border-top:1px solid var(--border);
  padding:30px 24px;text-align:center;font-size:12.5px;color:var(--muted2)}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--text)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="gblob gb1"></div><div class="gblob gb2"></div>

<div class="wrap">
  <a class="back" href="{{HOME}}">← All pages</a>
  <span class="markdots" aria-hidden="true"><i></i><i></i><i></i><i></i></span>

  <p class="eyebrow">{{TAG}}</p>
  <h1>{{TITLE}}</h1>
  <p class="lede">{{LINE}}</p>

  <!-- ── write the page from here ─────────────────────────────────────── -->

  <h2>A heading</h2>
  <p>Body copy.</p>

  <div class="card">
    <p style="margin:0">A call-out, if you want one.</p>
  </div>

  <!-- ─────────────────────────────────────────────────────────────────── -->
</div>

<footer>
  Curious · Caring · Constructive · Chill —
  an initiative of the <a href="https://selfdriven.foundation" target="_blank" rel="noopener">selfdriven Foundation</a>
</footer>
</body>
</html>
