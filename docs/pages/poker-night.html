  --display:'Bebas Neue','Oswald','Arial Narrow',Impact,sans-serif;
  --body:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:'Space Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;

  --side:212px;
  --tick:34px;
}
*{margin:0;padding:0;box-sizing:border-box}
/* the page never scrolls sideways — clip rather than scroll, so the sticky
   header keeps working (overflow:hidden would break it) */
html{-webkit-text-size-adjust:100%;overflow-x:hidden;overflow-x:clip}
body{overflow-x:hidden;overflow-x:clip}
body{
  background:var(--bg); color:var(--cream); font-family:var(--body);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  min-height:100vh; padding-top:var(--tick);
}
button{background:none;border:none;color:inherit;font:inherit;cursor:pointer}
a{color:var(--felt-hi);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--felt-hi);outline-offset:2px;border-radius:3px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.03)}
::-webkit-scrollbar-thumb{background:rgba(53,214,143,.28);border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}
.up{text-transform:uppercase;letter-spacing:.14em}

/* ---------- ticker ---------- */
.ticker{
  position:fixed;top:0;left:0;right:0;height:var(--tick);z-index:60;
  background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;overflow:hidden;
}
.ticker-track{display:flex;white-space:nowrap;animation:marquee 46s linear infinite;will-change:transform}
.ticker-run{display:flex;align-items:center;padding-right:0}
.ticker-item{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);padding:0 22px;display:flex;align-items:center;gap:8px;
}
.ticker-item b{color:var(--cream);font-weight:400}
.ticker-item .dot{width:5px;height:5px;border-radius:50%;background:var(--felt-hi);flex:none}
.ticker-item.warn .dot{background:var(--gold)}
.ticker-item.warn b{color:var(--gold)}
.ticker-item.sep{color:var(--felt-hi);letter-spacing:.34em;opacity:.75}
.ticker-item.dim{opacity:.5}
.ticker-item.dim .dot{background:var(--faint)}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ---------- shell ---------- */
/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:var(--tick);z-index:50;background:rgba(10,10,10,.86);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:20px;
  padding:0 26px;height:62px}
.brand{display:flex;align-items:center;gap:12px;flex:none}
.brand .mark{
  width:34px;height:34px;border-radius:8px;flex:none;
  background:var(--aces) center/cover no-repeat,var(--panel-2);
  border:1px solid var(--line-2);
  box-shadow:0 2px 10px rgba(0,0,0,.5);
}
.brand h1{font-family:var(--display);font-size:25px;letter-spacing:.05em;line-height:1;
  font-weight:400;padding-top:2px}

nav.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  padding:9px 15px;border-radius:999px;white-space:nowrap;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);transition:color .15s,background .15s;
}
nav.tabs button:hover{color:var(--cream);background:rgba(255,255,255,.05)}
nav.tabs button[aria-current="true"]{color:#04140C;background:var(--felt-hi);font-weight:700}
nav.tabs .nav-div{width:1px;background:var(--line-2);margin:0 10px;flex:none;align-self:stretch}
nav.tabs button.host{border:1px solid var(--line-2);color:var(--gold);gap:7px}
nav.tabs button.host::before{content:'♠';font-size:11px;margin-right:6px;opacity:.8}
nav.tabs button.host:hover{border-color:var(--gold);background:var(--gold-dim);color:var(--gold)}
nav.tabs button.host[aria-current="true"]{background:var(--gold);border-color:var(--gold);color:#1A1204}

/* segmented control inside Game Night */
.segs{display:flex;gap:6px;margin:16px 0 14px;flex-wrap:wrap}
.segs button{
  flex:1;min-width:140px;border:1px solid var(--line);background:var(--panel);border-radius:2px;
  padding:14px 16px;text-align:left;transition:all .16s;
}
.segs button .t{font-family:var(--display);font-size:19px;letter-spacing:.05em;line-height:1;color:var(--cream)}
.segs button .s{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--faint);margin-top:6px}
.segs button:hover{border-color:var(--line-2);background:var(--panel-2)}
.segs button[aria-pressed="true"]{border-color:var(--felt);background:var(--felt-dim)}
.segs button[aria-pressed="true"] .t{color:var(--felt-hi)}
.segs button[aria-pressed="true"] .s{color:var(--muted)}

.navcount{
  flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);
  border-radius:999px;padding:7px 14px;font-family:var(--mono);font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
}
.navcount b{color:var(--felt-hi);font-weight:400}
.navcount .pip{width:6px;height:6px;border-radius:50%;background:var(--felt-hi);
  animation:blink 2.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

main{padding:30px 26px 40px}
.wrap{max-width:1180px;margin:0 auto}

/* ---------- page head ---------- */
.phead{margin-bottom:22px}
.phead h2{font-family:var(--display);font-size:clamp(34px,5.4vw,50px);letter-spacing:.02em;
  line-height:.95;font-weight:400}
.phead .meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin-top:9px}

/* ---------- hero ---------- */
.hero{
  --img:var(--shot); --pos:center 8%; --dim:.9;
  position:relative;text-align:center;border-radius:3px;overflow:hidden;
  padding:clamp(64px,12vw,132px) 20px clamp(46px,8vw,82px);
  border:1px solid var(--line);isolation:isolate;
}
/* the photo, sunk into the black so it reads as atmosphere, not stock */
.hero::before{
  content:'';position:absolute;inset:0;z-index:-2;
  background:var(--img) var(--pos)/cover no-repeat;
  opacity:var(--dim);
}
.hero.slim{padding:clamp(34px,6vw,58px) 20px clamp(28px,4vw,42px)}
.hero.slim h2{font-size:clamp(34px,6.4vw,66px)}
.hero::after{
  content:'';position:absolute;inset:0;z-index:-1;
  background:
    radial-gradient(ellipse 78% 96% at 50% 42%,rgba(10,10,10,0) 0%,rgba(10,10,10,.45) 58%,rgba(10,10,10,.95) 100%),
    linear-gradient(to bottom,rgba(10,10,10,.9) 0%,rgba(10,10,10,.12) 22%,rgba(10,10,10,.15) 58%,rgba(10,10,10,.92) 92%,#0A0A0A 100%),
    linear-gradient(to right,#0A0A0A 0%,rgba(10,10,10,0) 22%,rgba(10,10,10,0) 78%,#0A0A0A 100%);
}
.hero .kick{font-family:var(--mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--felt-hi);margin-bottom:16px;text-shadow:0 2px 12px rgba(0,0,0,.9)}
.hero h2{font-family:var(--display);font-size:clamp(46px,9.4vw,110px);line-height:.86;
  letter-spacing:.02em;font-weight:400;text-shadow:0 4px 34px rgba(0,0,0,.95)}
.hero .sub{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(242,240,233,.72);margin-top:16px;text-shadow:0 2px 12px rgba(0,0,0,.9)}

/* ---------- stat cards ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--felt);
  padding:16px 17px 18px;border-radius:2px;position:relative;overflow:hidden}
.stat.gold{border-top-color:var(--gold)}
.stat.red{border-top-color:var(--red)}
.stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px}
.stat .v{font-family:var(--display);font-size:44px;line-height:.9;letter-spacing:.01em;
  color:var(--felt-hi);word-break:break-word}
.stat.gold .v{color:var(--gold)}
.stat.cream .v{color:var(--cream)}
.stat .v small{font-size:20px;opacity:.75}
.stat .n{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:9px;
  letter-spacing:.1em;text-transform:uppercase}

/* ---------- panels ---------- */
.cols{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start;margin-bottom:14px}
.cols>*{min-width:0}
.cols.even{grid-template-columns:1fr 1fr}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:2px}
.panel-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:15px 18px;border-bottom:1px solid var(--line)}
.panel-hd h3{font-family:var(--display);font-size:17px;letter-spacing:.06em;font-weight:400}
.panel-hd .c{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.panel-bd{padding:18px}
.panel-bd.flush{padding:0}
.rail{display:flex;flex-direction:column;gap:14px}

/* ---------- venue ---------- */
.venue .addr{font-family:var(--display);font-size:26px;line-height:1.08;letter-spacing:.02em;margin-bottom:4px}

/* ---------- meters ---------- */
.meter{margin-bottom:14px}
.meter:last-child{margin-bottom:0}
.meter .row{display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-bottom:7px}
.meter .row b{color:var(--cream);font-weight:400}
.track{height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--felt-hi);border-radius:3px;
  transition:width .45s cubic-bezier(.2,.7,.3,1)}
.track i.gold{background:var(--gold)}
.track i.red{background:var(--red)}

/* ---------- rsvp ---------- */
.mini{font-size:11.5px;color:var(--muted);line-height:1.5}

/* ---------- record-a-win controls ---------- */
.edit-btn{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid var(--line-2);color:var(--muted);padding:6px 12px;border-radius:2px;
  transition:all .15s;white-space:nowrap;
}
.edit-btn:hover{border-color:var(--felt-hi);color:var(--felt-hi)}
.edit-btn[aria-pressed="true"]{background:var(--felt);border-color:var(--felt);color:#04140C;font-weight:700}
.bump{display:inline-flex;gap:6px}
.bump button{
  width:30px;height:30px;border:1px solid var(--line-2);border-radius:2px;color:var(--muted);
  font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.bump button:hover:not(:disabled){border-color:var(--felt-hi);color:var(--felt-hi);background:var(--felt-dim)}
.bump button.plus{color:var(--felt-hi);border-color:rgba(53,214,143,.35)}
.bump button.plus:hover{background:var(--felt);border-color:var(--felt);color:#04140C}
.bump button:disabled{opacity:.3;cursor:not-allowed}
.wins{font-family:var(--display);font-size:22px;line-height:1;color:var(--gold)}

/* ---------- a player's nights, on a click of their name ---------- */
.who{color:var(--cream);border-bottom:1px dotted var(--line-2);padding-bottom:1px;transition:all .15s}
.who:hover{color:var(--felt-hi);border-bottom-color:var(--felt-hi)}
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:18px}
.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(6,8,7,.78);backdrop-filter:blur(3px)}
.sheet-card{
  position:relative;width:min(460px,100%);max-height:80vh;overflow:auto;
  background:var(--panel);border:1px solid var(--line-2);border-radius:2px;
}
.sheet-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-hd h3{font-family:var(--display);font-size:22px;letter-spacing:.05em;font-weight:400}
.sheet-hd .c{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:4px}
.sheet-x{border:1px solid var(--line-2);border-radius:2px;width:28px;height:28px;flex:none;
  color:var(--muted);font-size:15px;line-height:1;transition:all .15s}
.sheet-x:hover{border-color:var(--red);color:var(--red)}
.sheet-bd{padding:6px 18px 18px}
.nite{padding:14px 0;border-bottom:1px solid var(--line)}
.nite:last-child{border-bottom:0}
.nite .g{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.nite .d{font-family:var(--display);font-size:20px;letter-spacing:.04em;margin-top:3px}
.nite p{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.5}
.nite .take{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--felt-hi);margin-top:6px}
.nite.unknown .d{color:var(--faint)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
button.ghost{
  border:1px solid var(--line-2);padding:9px 14px;border-radius:2px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--cream);transition:all .15s;
}
button.ghost:hover{border-color:var(--felt-hi);color:var(--felt-hi);background:var(--felt-dim)}

/* ---------- avatars ---------- */
.av{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;
  border-radius:50%;overflow:hidden;background:var(--panel-2);border:1px solid var(--line-2)}
.av svg{width:100%;height:100%;fill:rgba(242,240,233,.13)}
.av b{position:absolute;font-family:var(--display);font-weight:400;letter-spacing:.04em;
  color:rgba(242,240,233,.5);line-height:1}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av-sm{width:34px;height:34px} .av-sm b{font-size:13px}
.av-md{width:52px;height:52px} .av-md b{font-size:18px}
.av-lg{width:66px;height:66px} .av-lg b{font-size:23px}
.pseat.out .av{filter:grayscale(1);opacity:.4}

/* ---------- the poker table ---------- */
.tablewrap{position:relative;width:100%;aspect-ratio:16/9;min-height:400px;margin:6px 0 4px}
.felt{
  position:absolute;inset:21% 16%;border-radius:999px;
  background:radial-gradient(ellipse at 50% 42%,#1B7A54 0%,#125138 62%,#0C3626 100%);
  border:10px solid #2E2018;
  box-shadow:0 0 0 2px rgba(0,0,0,.5),inset 0 0 60px rgba(0,0,0,.45),0 18px 50px rgba(0,0,0,.5);
}
.felt::after{content:'';position:absolute;inset:16px;border-radius:999px;
  border:1px solid rgba(255,255,255,.10)}
.felt-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;pointer-events:none;padding:0 12%}
.felt-mid .lg{font-family:var(--display);font-size:clamp(22px,3.4vw,38px);letter-spacing:.14em;
  color:rgba(255,255,255,.22);line-height:1}
.felt-mid .sm{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.28);margin-top:9px}
.pseat{
  position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;
  align-items:center;width:88px;text-align:center;
  animation:seatIn .5s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes seatIn{from{opacity:0;transform:translate(-50%,-50%) scale(.82)}
                  to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.pseat .nm{font-size:11.5px;font-weight:600;margin-top:6px;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pseat .cd{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--faint);margin-top:2px}
.pseat.out .nm{color:var(--faint);text-decoration:line-through}
.pseat.out .cd{color:var(--red);text-decoration:none;letter-spacing:.14em}
.pseat .kill{
  margin-top:5px;font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;
  border:1px solid var(--line-2);border-radius:2px;padding:3px 7px;color:var(--muted);transition:all .15s;
}
.pseat .kill:hover{border-color:var(--red);color:var(--red)}
.pseat.out .kill:hover{border-color:var(--felt-hi);color:var(--felt-hi)}
.badge{position:absolute;top:-3px;width:19px;height:19px;border-radius:50%;font-size:11px;
  line-height:19px;text-align:center;border:1px solid rgba(0,0,0,.4);font-family:var(--display)}
.badge.deal{right:4px;background:var(--cream);color:#0A0A0A}
.badge.fly{left:4px;background:var(--gold);color:#1A1204;font-family:var(--body);font-size:10px}
.badge.maybe{left:4px;background:var(--panel-2);color:var(--muted);border-color:var(--line-2);
  font-family:var(--body);font-size:10px;font-weight:700}
.pseat.out .badge{opacity:.35}
.pseat.mb .av{opacity:.62}
.pseat.mb .nm{color:var(--muted)}
.pseat.mb .cd{color:var(--faint);letter-spacing:.14em}

/* the one-line callout under the felt */
.callout{
  display:flex;align-items:center;gap:13px;background:var(--gold-dim);
  border:1px solid rgba(232,184,75,.3);border-left:3px solid var(--gold);
  padding:14px 18px;border-radius:2px;margin-top:14px;
}
.callout.quiet{background:rgba(255,255,255,.022);border-color:var(--line);border-left-color:var(--line-2);margin-top:10px}
.callout.quiet .ic{color:var(--muted);font-family:var(--display);font-size:21px}
.callout .ic{font-size:19px;line-height:1;flex:none;color:var(--gold)}
.callout .tx{font-size:14px;color:rgba(242,240,233,.82)}
.callout .tx b{color:var(--cream);font-weight:600}

.tablewrap.isempty .felt-mid .lg{color:rgba(255,255,255,.32)}

/* ---------- the demo hand ---------- */
.mc{
  width:23px;height:32px;border-radius:3px;background:#F6F5F1;color:#14181A;flex:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  border:1px solid rgba(0,0,0,.28);box-shadow:0 2px 6px rgba(0,0,0,.5);
  font-family:var(--display);font-size:13px;letter-spacing:0;
}
.mc em{font-style:normal;font-size:11px;margin-top:1px}
.mc.red{color:#C22F35}
.mc.down{background:repeating-linear-gradient(45deg,#123E2C 0 4px,#0D2E20 4px 8px);border-color:#0A2418}
.mc.down i,.mc.down em{display:none}
.mc.deal{animation:mcDeal .34s cubic-bezier(.2,.9,.3,1) both}
@keyframes mcDeal{from{opacity:0;transform:translate(0,-46px) scale(.6) rotate(-14deg)}to{opacity:1;transform:none}}
.mc.turn{animation:mcTurn .42s ease both}
@keyframes mcTurn{0%{transform:rotateY(90deg) scale(.9)}60%{transform:rotateY(0) scale(1.06)}100%{transform:none}}

/* hole cards lie on the felt in front of the player, and the bet sits
   between them and the pot — WSOP layout */
.pseat .hand{
  position:absolute;left:50%;display:flex;z-index:3;pointer-events:none;
  transition:opacity .4s;transform:translate(-50%,-50%);
}
.pseat .hand .mc:first-child{transform:rotate(-8deg)}
.pseat .hand .mc:last-child{transform:rotate(8deg);margin-left:-8px}
.pseat.fold .hand{opacity:0}
.pseat.fold .av{filter:grayscale(1);opacity:.28}
.pseat.fold .nm,.pseat.fold .cd{opacity:.35}
.pseat.acting .av{box-shadow:0 0 0 2px var(--felt-hi),0 0 22px rgba(53,214,143,.5)}
.pseat.won .av{box-shadow:0 0 0 3px var(--gold),0 0 34px rgba(232,184,75,.65)}
.pseat.won .nm{color:var(--gold)}
/* a player's bet: a stack of chips with the amount beside it */
.pseat .chip{
  position:absolute;left:50%;z-index:4;opacity:0;pointer-events:none;white-space:nowrap;
  display:flex;align-items:center;gap:5px;
  background:rgba(4,14,10,.72);border:1px solid rgba(255,255,255,.14);border-radius:999px;
  padding:2px 8px 2px 3px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:#F2F0E9;
  transform:translate(-50%,-50%) scale(.7);
  transition:transform .5s cubic-bezier(.3,.8,.3,1),opacity .35s;
}
.pseat .chip.push{opacity:1;transform:translate(-50%,-50%) scale(1)}
.pseat .chip .stk{display:flex;flex-direction:column-reverse;gap:1px;width:13px}
.pseat .chip .stk i{display:block;height:3px;border-radius:2px;box-shadow:0 0 0 .5px rgba(0,0,0,.5)}

/* the pot: a real stack of chips under the number */
.potstack{display:flex;align-items:flex-end;gap:4px;height:26px}
.potstack .col{display:flex;flex-direction:column-reverse;gap:1.5px;width:17px}
.potstack .col i{display:block;height:4px;border-radius:2px;box-shadow:0 0 0 .5px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.5)}
.c-w{background:#EDEAE2} .c-r{background:#C8322F} .c-g{background:#1E9A63}
.c-b{background:#2C63C6} .c-k{background:#1B1F23} .c-y{background:#E8B84B}

.board{
  position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;pointer-events:none;opacity:0;transition:opacity .55s;
}
.tablewrap.playing .board{opacity:1}
.tablewrap.playing .felt-mid{opacity:0}
.felt-mid{transition:opacity .55s}
.potwrap{display:flex;flex-direction:column;align-items:center;gap:7px}
.board .pot{
  font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.42);
}
.board .pot b{font-family:var(--display);font-size:26px;letter-spacing:.03em;
  color:var(--gold);margin-left:8px;vertical-align:-2px}
.board-cards{display:flex;gap:7px;min-height:52px;align-items:center}
.board-cards .mc{width:37px;height:52px;font-size:20px}
.board-cards .mc em{font-size:16px}
.board .act{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.72);min-height:16px;text-align:center;padding:0 8%;
}
.board .act b{color:var(--felt-hi)}
/* the winning line gets the room it deserves */
.board .act.win{font-size:15px;letter-spacing:.1em;line-height:1.6;padding:0 20%}
.board .act.win b{color:var(--gold);font-size:17px}
@media (max-width:760px){ .board .act.win{font-size:12px} .board .act.win b{font-size:13px} }

/* Seats that were not at the table for this hand. Important beats the
   seatIn animation, which otherwise keeps them fading themselves back in. */
.pseat.gone{opacity:0!important;pointer-events:none}

/* the payout line printed on the felt */
.pay-felt{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 14px;
  margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.13);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
  color:rgba(255,255,255,.42);max-width:520px;
}
.pay-felt span{white-space:nowrap}
.pay-felt b{color:rgba(255,255,255,.82);font-weight:400;margin-right:5px}
.pay-felt .last b{color:var(--gold);opacity:.85}

/* roster picker */
.picks{display:flex;flex-wrap:wrap;gap:7px}
.pick{
  display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:2px;
  padding:6px 11px 6px 6px;font-size:12px;color:var(--muted);transition:all .15s;
}
.pick:hover{border-color:var(--felt-hi);color:var(--cream)}
.pick[aria-pressed="true"]{border-color:var(--felt);background:var(--felt-dim);color:var(--cream)}
.pick .av{width:24px;height:24px} .pick .av b{font-size:10px}
.guest-row{display:flex;gap:8px;margin-top:14px}
.guest-row input{
  flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line-2);border-radius:2px;
  padding:9px 12px;color:var(--cream);font-size:13px;
}
.guest-row input::placeholder{color:var(--faint)}
.guest-row input:focus{outline:none;border-color:var(--felt-hi)}

/* ---------- the clock ---------- */
.clockface{
  background:radial-gradient(ellipse at 50% 0%,rgba(31,163,107,.14),transparent 62%),var(--panel);
  border:1px solid var(--line);border-top:2px solid var(--felt);border-radius:2px;
  padding:34px 24px 30px;text-align:center;
}
.clockface.brk{border-top-color:var(--gold);
  background:radial-gradient(ellipse at 50% 0%,rgba(232,184,75,.14),transparent 62%),var(--panel)}
.clockface .lvl{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--muted)}
.clockface .big{font-family:var(--display);font-size:clamp(72px,17vw,168px);line-height:.86;
  letter-spacing:.02em;color:var(--felt-hi);margin:12px 0 14px}
.clockface.brk .big{color:var(--gold)}
.clockface .blindnow{font-family:var(--display);font-size:clamp(26px,4.4vw,42px);letter-spacing:.05em;
  color:var(--cream);line-height:1}
.clockface .ante{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin-top:8px}
.clockbar{height:4px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin:22px 0 20px}
.clockbar i{display:block;height:100%;background:var(--felt-hi);border-radius:3px;transition:width .5s linear}
.clockface.brk .clockbar i{background:var(--gold)}
.clockbtns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.cbtn{
  border:1px solid var(--line-2);border-radius:2px;padding:11px 20px;color:var(--cream);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;transition:all .15s;
}
.cbtn:hover{border-color:var(--felt-hi);color:var(--felt-hi);background:var(--felt-dim)}
.cbtn.go{background:var(--felt);border-color:var(--felt);color:#04140C;font-weight:700;padding:11px 34px}
.cbtn.go:hover{background:var(--felt-hi);border-color:var(--felt-hi);color:#04140C}
.upnext{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;
  border-bottom:1px solid var(--line)}
.upnext:last-child{border-bottom:none}
.upnext .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.upnext .v{font-family:var(--display);font-size:20px;line-height:1;letter-spacing:.03em}
.upnext.now{background:var(--felt-dim);margin:0 -18px;padding:12px 18px}
.upnext.now .v{color:var(--felt-hi)}
.upnext.isbrk .v{color:var(--gold)}
.upnext .v.runv{font-family:var(--body);font-size:13.5px;color:var(--muted);text-align:right;
  max-width:60%;line-height:1.4}

/* ---------- table ---------- */
.tscroll{overflow-x:auto;max-width:100%}
table.lb{width:100%;border-collapse:collapse;min-width:290px}
table.lb th{
  font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);text-align:left;padding:12px 18px;border-bottom:1px solid var(--line);font-weight:400;
}
table.lb th.r,table.lb td.r{text-align:right}
table.lb td{padding:13px 18px;border-bottom:1px solid var(--line);font-size:13.5px}
table.lb tr:last-child td{border-bottom:none}
table.lb tbody tr:hover{background:rgba(255,255,255,.02)}
.pos{font-family:var(--display);font-size:19px;color:var(--faint);line-height:1;width:34px}
.zero{color:var(--faint);font-family:var(--mono);font-size:12px}

/* ---------- empty state ---------- */
.empty{padding:44px 18px;text-align:center}
.empty .big{font-family:var(--display);font-size:clamp(28px,4.5vw,40px);letter-spacing:.03em;
  color:var(--faint);line-height:1;margin-bottom:12px}
.empty p{font-size:13px;color:var(--muted);max-width:420px;margin:0 auto}

/* ---------- controls ---------- */
.ctl{margin-bottom:16px}
.ctl:last-child{margin-bottom:0}
.ctl .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.ctl label{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.ctl output{font-family:var(--display);font-size:22px;line-height:1;color:var(--felt-hi)}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:3px;
  background:rgba(255,255,255,.09);outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:17px;height:17px;border-radius:50%;
  background:var(--felt-hi);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--felt-hi);cursor:pointer;
}
input[type=range]::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;background:var(--felt-hi);
  border:3px solid var(--bg);box-shadow:0 0 0 1px var(--felt-hi);cursor:pointer;
}

/* ---------- who gets paid ---------- */
.pay-row{display:flex;gap:16px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line)}
.pay-row:first-child{padding-top:2px}
.pay-row:last-child{border-bottom:none;padding-bottom:2px}
.pay-row .pl{
  font-family:var(--display);font-size:26px;line-height:1;width:46px;flex:none;letter-spacing:.02em;
}
.pay-row.first .pl{color:var(--gold)}
.pay-row.second .pl{color:var(--felt-hi)}
.pay-row.none .pl{color:var(--faint)}
.pay-row .px b{display:block;font-size:15px;font-weight:600;color:var(--cream)}
.pay-row .px span{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.pay-row.none .px b{color:var(--muted)}

/* ---------- payout split ---------- */
.split{display:flex;height:44px;border-radius:2px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px}
.split div{display:flex;align-items:center;justify-content:center;font-family:var(--mono);
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;transition:flex-basis .4s cubic-bezier(.2,.7,.3,1);
  overflow:hidden;white-space:nowrap}
.split .first{background:var(--gold);color:#1A1204;font-weight:700}
.split .second{background:var(--felt);color:#04140C;font-weight:700}
.payline{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);
  align-items:baseline}
.payline:last-child{border-bottom:none}
.payline .k{font-size:13px;color:var(--muted)}
.payline .k b{color:var(--cream);font-weight:500;display:block;font-size:13.5px}
.payline .v{font-family:var(--display);font-size:26px;line-height:1;color:var(--cream)}
.payline .v.gold{color:var(--gold)} .payline .v.green{color:var(--felt-hi)}

/* ---------- chips ---------- */
.chips3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:4px}
.buyc{border:1px solid var(--line);padding:16px 14px;text-align:center;border-radius:2px;background:var(--panel-2)}
.disc{width:46px;height:46px;border-radius:50%;margin:0 auto 11px;display:flex;align-items:center;
  justify-content:center;font-family:var(--display);font-size:15px;line-height:1;color:#fff;
  border:3px dashed rgba(255,255,255,.55);}
.disc.g{background:var(--felt)} .disc.y{background:var(--gold);color:#1A1204;border-color:rgba(0,0,0,.3)}
.disc.r{background:var(--red)}
.buyc .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cream)}
.buyc .n{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.4}

/* ---------- blinds strip ---------- */
.blinds{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;max-width:100%}
.bl{flex:none;min-width:84px;border:1px solid var(--line);padding:11px 12px;border-radius:2px;background:var(--panel-2)}
.bl .n{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.bl .v{font-family:var(--display);font-size:19px;line-height:1;margin-top:6px;letter-spacing:.02em}
.bl .a{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:5px}
.bl.brk{border-color:rgba(232,184,75,.4);background:var(--gold-dim)}
.bl.brk .v{color:var(--gold)}

/* ---------- misc ---------- */
ul.dots{list-style:none}
ul.dots li{position:relative;padding-left:18px;margin-bottom:10px;font-size:13.5px;color:rgba(242,240,233,.78)}
ul.dots li:last-child{margin-bottom:0}
ul.dots li::before{content:'';position:absolute;left:2px;top:8px;width:5px;height:5px;
  border-radius:50%;background:var(--felt-hi)}
ul.dots li b{color:var(--cream);font-weight:600}

.tag-row{display:flex;flex-wrap:wrap;gap:7px}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  border:1px solid var(--line-2);color:var(--muted);padding:5px 10px;border-radius:2px}
.tag.on{border-color:var(--felt);color:var(--felt-hi);background:var(--felt-dim)}

.fade{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* ==========================================================================
   THE DEAL — changing tab deals the new page in like a hand of cards,
   behind a single sweep of felt-green light.
   ========================================================================== */
#view.deal > *{animation:dealIn .5s cubic-bezier(.17,.86,.28,1) both}
@keyframes dealIn{
  from{opacity:0;transform:translate3d(34px,-30px,0) rotate(3.2deg) scale(.982)}
  60% {opacity:1}
  to  {opacity:1;transform:none}
}
/* the band is clipped by a viewport-sized parent so it can never widen the page */
.sweep{position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden}
.sweep i{
  position:absolute;top:-10%;bottom:-10%;left:0;width:64%;transform:translateX(-200%);
  background:linear-gradient(102deg,
    transparent 0%,
    rgba(31,163,107,.10) 34%,
    rgba(53,214,143,.28) 50%,
    rgba(31,163,107,.10) 66%,
    transparent 100%);
}
.sweep.on i{animation:sweepGo .58s cubic-bezier(.45,0,.35,1) both}
@keyframes sweepGo{from{transform:translateX(-200%)}to{transform:translateX(300%)}}

/* ==========================================================================
   CURSOR — a chip-edged ring that trails the pointer, with a chip-toss
   ripple on click. Desktop pointers only; touch is left completely alone.
   ========================================================================== */
.cur,.cur-dot,.ripple{display:none}
@media (pointer:fine){
  html.cur-on,html.cur-on *{cursor:none!important}
  .cur{
    display:block;position:fixed;top:0;left:0;width:34px;height:34px;border-radius:50%;
    border:1.5px dashed rgba(242,240,233,.55);margin:-17px 0 0 -17px;
    z-index:9999;pointer-events:none;
    transition:width .18s,height .18s,margin .18s,border-color .18s,background .18s,opacity .2s;
    will-change:transform;
  }
  .cur.hot{
    width:46px;height:46px;margin:-23px 0 0 -23px;
    border-color:var(--felt-hi);background:rgba(53,214,143,.10);border-style:solid;
  }
  .cur.press{width:26px;height:26px;margin:-13px 0 0 -13px;background:rgba(53,214,143,.24)}
  .cur-dot{
    display:block;position:fixed;top:0;left:0;width:5px;height:5px;border-radius:50%;
    background:var(--felt-hi);margin:-2.5px 0 0 -2.5px;z-index:10000;pointer-events:none;
    will-change:transform;
  }
  .ripple{
    display:block;position:fixed;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;
    border:2px dashed var(--felt-hi);z-index:9998;pointer-events:none;
    animation:chipToss .62s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes chipToss{
    from{opacity:.85;transform:scale(.4) rotate(0deg)}
    to  {opacity:0;transform:scale(5.4) rotate(120deg)}
  }
}
@media (prefers-reduced-motion:reduce){
  .cur,.cur-dot,.ripple{display:none!important}
  html.cur-on,html.cur-on *{cursor:auto!important}
  .sweep.on{animation:none}
  #view.deal > *{animation:none}
}

/* ---------- responsive ---------- */
@media(max-width:1000px){
  .cols{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:900px){

}
@media(max-width:760px){
  .topbar-in{height:auto;padding:12px 14px;flex-wrap:wrap;gap:10px}
  .brand h1{font-size:19px}
  nav.tabs{margin-left:0;width:100%;order:3;padding-bottom:2px}
  nav.tabs button{padding:8px 12px;font-size:9.5px}

  /* the felt turns portrait on a phone — a real table, not a grid */
  .tablewrap{aspect-ratio:.72;min-height:0}
  .felt{inset:13% 20%;border-width:7px}

  .pay-felt{font-size:7.5px;gap:3px 9px;margin-top:10px;padding-top:9px;max-width:none}

  .av-md{width:38px;height:38px} .av-md b{font-size:13px}
  .badge{width:15px;height:15px;font-size:9px;line-height:15px}
  .badge.deal{right:0} .badge.fly{left:0}

  .board{gap:8px}

}
@media(max-width:420px){
  .stats{grid-template-columns:1fr 1fr;gap:10px}

  .stats{grid-template-columns:1fr}

}

  </div>
</header>

<main>
  <div class="wrap" id="view"></div>
</main>

<script>
"use strict";
/* ==========================================================================
   DATA — everything you'd want to change lives in this block.
   ========================================================================== */

const EVENT = {
  /* No date set for the next one. Put the kick-off back in `iso` and
     `dayLabel` when there is one and the countdown starts itself up again;
     until then the whole page just says soon. */
  iso:      null,
  dayLabel: "Soon",
  timeLabel:"5:00 PM",
  cardsAt:  "5-ish",
  venue:    "Address as per before",
  venueNote:"Same place as last time. The address is in the group chat, not on this page.",
  season:   "Season 2026",
};

const MONEY = { buyIn:50, rebuy:50, addon:50, stack:5000, levelMins:20, rebuyClosesAfter:6 };

/* Seat numbers are derived from this order — add or remove a player and the
   whole page renumbers itself. Card ranks run down from the ace. */
const PLAYERS = [
  { id:"peter",    name:"Peter",   rank:"A",  suit:"♠", host:true },
  { id:"stephen",  name:"Stephen", rank:"K",  suit:"♥" },
  { id:"matt",     name:"Matt",    rank:"Q",  suit:"♦" },
  { id:"scott",    name:"Scott",   rank:"J",  suit:"♣", flying:true },
  { id:"kyle",     name:"Kyle",    rank:"10", suit:"♠", maybe:true },
  { id:"martin",   name:"Martin",  rank:"9",  suit:"♥" },
  { id:"damo",     name:"Damo",    rank:"8",  suit:"♦" },
  { id:"jeevan",   name:"Jeevan",  rank:"7",  suit:"♣" },
  { id:"vinnie",   name:"Vinnie",  rank:"6",  suit:"♦" },
  { id:"piet",     name:"Piet",    rank:"5",  suit:"♠", maybe:true },
].map((p, i) => ({ ...p, seat:i + 1, role:p.host ? "Host · Dealer" : "Seat " + (i + 1) }));

/* Wins on the board. Edit on the night in the Leaderboard tab, then use
   "copy for the file" and paste the result back here to make it permanent. */
const WINS = {
  stephen: 2,
  matt:    1,
  scott:   2,
  jeevan:  3,
  damo:    2,
  peter:   1,
  martin:  2,
  vinnie:  1,
  kyle:    0,
  piet:    0,
};

const LEVELS = [
  { sb:25,   bb:50 },   { sb:50,   bb:100 },  { sb:75,   bb:150 },
  { sb:100,  bb:200 },  { sb:150,  bb:300 },  { sb:200,  bb:400 },
  { brk:true, mins:15 },
  { sb:250,  bb:500,   ante:500 },   { sb:400,  bb:800,   ante:800 },
  { sb:500,  bb:1000,  ante:1000 },  { sb:700,  bb:1400,  ante:1400 },
  { sb:1000, bb:2000,  ante:2000 },  { sb:1500, bb:3000,  ante:3000 },
  { sb:2000, bb:4000,  ante:4000 },  { sb:3000, bb:6000,  ante:6000 },
  { sb:5000, bb:10000, ante:10000 }, { sb:8000, bb:16000, ante:16000 },
];

/* Deliberately vague — we have never once run to a schedule. */
const RUNSHEET = [
  ["Doors open",  "5-ish"],
  ["Cards up",    "once everyone's here"],
  ["Rebuys close","end of level 6"],
  ["Break",       "after level 6, fifteen minutes"],
  ["Last hand",   "late"],
];

/* ==========================================================================
   HELPERS
   ========================================================================== */
const $  = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + Math.round(n).toLocaleString("en-AU");
const isRed = s => s === "♥" || s === "♦";
const nameList = ps => { const n = ps.map(p => p.name.split(" ")[0]);
  return n.length < 2 ? n.join("") : n.slice(0, -1).join(", ") + " and " + n[n.length - 1]; };
const store = {
  get(k, d){ try{ const v = localStorage.getItem("pokernight."+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("pokernight."+k, JSON.stringify(v)); }catch(e){} },
};

/* The chronology. WINS above is the count; this is the story behind it —
   one entry per night we have a record of, newest last. We are missing the
   early nights, and that is fine: a player's win count can run ahead of the
   nights listed here, and the page says so rather than inventing a date.
   Add a night here whenever one gets played. */
const NIGHTS = [
  { game:14, iso:"2026-09-19", winner:"jeevan", second:"peter", pot:450, back:50,
    field:["peter","stephen","matt","scott","martin","damo","jeevan","vinnie"],
    note:"Heads-up with Peter. The turn made the boat, the river made Peter second." },
];

const DATEFMT = { day:"numeric", month:"long", year:"numeric" };
const nightDate = iso => {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-AU", DATEFMT);
};
/* every recorded night this player won, newest first */
const nightsWonBy = id => NIGHTS.filter(n => n.winner === id).sort((a, b) => b.iso.localeCompare(a.iso));

/* Only winners score. One win, one point on the board — nothing else counts.
   WINS above is the truth. Anything recorded on the night is stored as a whole
   set of numbers stamped against that truth, so the moment WINS changes in the
   file, stale edits on someone's device are thrown away rather than added on
   top — the board always shows what's written here. */
const WINS_STAMP = PLAYERS.map(p => p.id + ":" + (WINS[p.id] || 0)).join(",");
const winsBase = () => { const o = {}; PLAYERS.forEach(p => o[p.id] = Math.max(0, WINS[p.id] || 0)); return o; };
const winsNow = () => {
  const saved = store.get("wins.v2", null);
  if(!saved || saved.stamp !== WINS_STAMP) return winsBase();
  const o = winsBase();
  PLAYERS.forEach(p => { if(typeof saved.vals[p.id] === "number") o[p.id] = Math.max(0, saved.vals[p.id]); });
  return o;
};
/* Nights played so far = wins on the board, so the next one numbers itself. */
const nightsPlayed = () => PLAYERS.reduce((t, p) => t + winsNow()[p.id], 0);
const gameLabel = () => "Game " + String(nightsPlayed() + 1).padStart(2, "0");

function bumpWin(id, by){
  const vals = winsNow();
  vals[id] = Math.max(0, (vals[id] || 0) + by);
  store.set("wins.v2", { stamp:WINS_STAMP, vals:vals });
}
/* clear anything left behind by the old delta-based store */
try{ localStorage.removeItem("pokernight.wins"); }catch(e){}

/* ---------- faces ----------
   Drop photos next to this file as photos/peter.jpg (or .png) and they appear.
   Until then everyone gets a placeholder face with their initials. */
const initials = n => { const w = n.trim().split(/\s+/);
  return (w.length > 1 ? w.map(x => x[0]).slice(0, 2).join("") : w[0].slice(0, 2)).toUpperCase(); };
const avatar = (p, size) => `<span class="av av-${size}">
  <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="23" r="11.5"/><path d="M7.5 62c0-13.2 11-20.5 24.5-20.5S56.5 48.8 56.5 62z"/></svg>
  <b>${esc(initials(p.name))}</b>
  ${p.guest ? "" : `<img src="photos/${p.id}.jpg" alt=""
     onerror="if(this.dataset.t){this.remove()}else{this.dataset.t=1;this.src='photos/${p.id}.png'}">`}
</span>`;

/* ---------- tonight: who's at the table ---------- */
const night = () => Object.assign({ seated:[], out:[], guests:[], order:null }, store.get("night", {}));
const saveNight = n => store.set("night", n);
const roster = () => PLAYERS.concat(night().guests.map((g, i) =>
  ({ ...g, guest:true, rank:"★", suit:"", seat:PLAYERS.length + i + 1, role:"Guest" })));
const R = id => roster().find(x => x.id === id);
function atTable(){
  const n = night();
  const ord = n.order && n.order.length ? n.order : n.seated;
  return ord.filter(id => n.seated.includes(id)).map(R).filter(Boolean);
}

/* ---------- tonight: the clock ---------- */
const clock = () => Object.assign({ idx:0, endsAt:null, left:null, running:false }, store.get("clock", {}));
const saveClock = c => store.set("clock", c);
const lvlMs = i => { const L = LEVELS[i]; return L ? (L.brk ? L.mins : MONEY.levelMins) * 60000 : 0; };
const lvlNo = i => LEVELS.slice(0, i + 1).filter(L => !L.brk).length;
function msLeft(){
  const c = clock();
  if(c.running) return Math.max(0, c.endsAt - Date.now());
  return c.left === null ? lvlMs(c.idx) : Math.max(0, c.left);
}
const mmss = ms => { const t = Math.max(0, Math.ceil(ms / 1000));
  return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); };

/* ==========================================================================
   THE DEMO HAND — scripted hands that play themselves out on the
   Details felt: cards dealt, chips pushed, streets run, showdown, repeat.
   The first one is real — the hand that ended Game 14, heads-up, Peter
   against Jeevan. The rest are monsters we made up.
   ========================================================================== */
const HANDS = [
  /* Game 14, 19 September 2026. Eight seats — everyone but Kyle and Piet.
     It came down to Peter and Jeevan with the blinds at $800. The turn
     quietly made Jeevan a boat; the river paid Peter a second pair he was
     never going to win with. $450 to Jeevan, Peter's $50 back for second. */
  {
    label:"Last night · the hand that ended it",
    hole:{ peter:["K♠","2♣"], jeevan:["K♣","K♦"] },
    away:["kyle","piet"],
    dim:["stephen","matt","scott","martin","damo","vinnie"],
    board:["3♠","8♣","K♥","3♣","2♦"],
    streets:[
      { acts:[["peter","calls",800],["jeevan","calls",800]] },
      { acts:[["peter","bets",2000],["jeevan","calls",2000]] },
      { acts:[["peter","shoves",6000],["jeevan","calls",6000]] },
      { acts:[] },
    ],
    winner:"jeevan", with:"Full house, kings full of threes",
    note:"Congrats Jeevs — win #3 🏆 · $450 to Jeevan, Peter takes his $50 back for second",
  },
  {
    madeUp:true,
    hole:{ peter:["A♠","A♥"], stephen:["K♠","K♦"], matt:["Q♥","Q♣"], scott:["A♦","K♣"],
           kyle:["J♠","J♥"], martin:["10♦","10♣"], damo:["A♣","Q♦"], jeevan:["9♠","9♦"],
           vinnie:["K♥","Q♠"], piet:["8♣","8♥"] },
    board:["J♦","10♠","7♥","2♣","J♣"],
    streets:[
      { acts:[["scott","raises",300],["peter","3-bets",900],["kyle","calls",900],
              ["stephen","calls",900],["matt","folds"],["damo","folds"],["jeevan","folds"],
              ["vinnie","folds"],["martin","folds"],["piet","folds"],["scott","calls",600]] },
      { acts:[["kyle","checks",0],["peter","bets",1200],["stephen","calls",1200],
              ["scott","folds"],["kyle","calls",1200]] },
      { acts:[["kyle","checks",0],["peter","bets",2000],["stephen","folds"],["kyle","calls",2000]] },
      { acts:[["kyle","shoves",4500],["peter","calls",4500]] },
    ],
    winner:"kyle", with:"Four of a kind, jacks",
  },
  {
    madeUp:true,
    hole:{ peter:["K♥","K♠"], stephen:["A♣","A♦"], matt:["J♣","J♦"], scott:["Q♠","Q♥"],
           kyle:["A♠","K♣"], martin:["10♠","10♥"], damo:["9♣","9♥"], jeevan:["A♥","Q♦"],
           vinnie:["K♦","Q♣"], piet:["8♠","8♦"] },
    board:["J♥","10♦","9♠","4♥","3♦"],
    streets:[
      { acts:[["martin","raises",400],["matt","calls",400],["stephen","raises",1400],
              ["peter","calls",1400],["scott","folds"],["kyle","folds"],["damo","folds"],
              ["jeevan","folds"],["vinnie","folds"],["piet","folds"],["martin","calls",1000],
              ["matt","calls",1000]] },
      { acts:[["matt","bets",1800],["stephen","calls",1800],["peter","folds"],["martin","calls",1800]] },
      { acts:[["matt","bets",3200],["stephen","calls",3200],["martin","folds"]] },

const DATED = !!EVENT.iso;
const START = DATED ? new Date(EVENT.iso).getTime() : 0;
function countdown(){
  if(!DATED) return { tbc:true, done:false, d:0, h:0, m:0, s:0 };
  const ms = START - Date.now();
  if(ms <= 0) return { done:true, d:0, h:0, m:0, s:0 };
  const s = Math.floor(ms / 1000);
  return { done:false, d:Math.floor(s/86400), h:Math.floor(s/3600)%24, m:Math.floor(s/60)%60, s:s%60 };
}

/* The strip along the top is the roll-call: the facts, then every player
   by name and card, so everyone sees themselves scroll past. */
function tickerHTML(){
  const c = countdown();
  const fact = (k, v, cl) => `<span class="ticker-item ${cl || ""}"><i class="dot"></i>${k}: <b>${v}</b></span>`;
  const who  = p => `<span class="ticker-item ${p.flying ? "warn" : ""} ${p.maybe ? "dim" : ""}"><i class="dot"></i><b>${esc(p.name.split(" ")[0].toUpperCase())}</b>${
    p.flying ? " ✈ FLYING IN" : p.maybe ? " MAYBE" : p.host ? " HOST" : ""}</span>`;

  const items = [
    fact("NEXT GAME", DATED ? EVENT.dayLabel.toUpperCase() : "SOON"),
    fact("FROM", EVENT.timeLabel),
    fact("BUY-IN", money(MONEY.buyIn)),
    fact("COUNTDOWN", c.tbc ? "DATE TO COME" : c.done ? "GAME ON" : c.d + " DAYS", "warn"),
    `<span class="ticker-item sep">THE FIELD</span>`,
    ...PLAYERS.map(who),
    fact("SEATS", PLAYERS.length),
    fact("PAYMENT", "CASH OR PAYID"),
  ];
  const run = '<div class="ticker-run">' + items.join("") + '</div>';
  return run + run;
}

const VIEWS = { night:nightTab, game:gameTab, board:boardTab, money:moneyTab };

function render(){
  $("#nav").innerHTML =
    TABS.map(([k, l]) => `<button data-tab="${k}" aria-current="${tab === k}">${l}</button>`).join("")
    + '<span class="nav-div"></span>'
    + `<button class="host" data-tab="${HOST[0]}" aria-current="${tab === HOST[0]}">${HOST[1]}</button>`;
  paintNavCount();

  const v = $("#view");
  v.innerHTML = (VIEWS[tab] || nightTab)();
  /* deal the panels in, one after another */
  v.classList.remove("deal"); void v.offsetWidth; v.classList.add("deal");
  [...v.children].forEach((el, i) => el.style.animationDelay = (i * 62) + "ms");
  wire();
}

function go(t){
  if(t === tab) return;
  tab = t;
  const sw = $("#sweep");
  if(sw){
    sw.classList.remove("on"); void sw.offsetWidth; sw.classList.add("on");
    clearTimeout(sw._t);
    sw._t = setTimeout(() => sw.classList.remove("on"), 640);
  }
  render();
  window.scrollTo({ top:0, behavior:"instant" });
}

function paintNavCount(){
  const el = $("#navcount"); if(!el) return;
  const c = countdown();
  el.innerHTML = '<span class="pip"></span>' + (c.tbc
    ? "<b>date soon</b>"
    : c.done
    ? "<b>tonight</b>"
    : `<b>${c.d}d ${String(c.h).padStart(2,"0")}h ${String(c.m).padStart(2,"0")}m</b> to go`);
}

/* seats sit on an ellipse around the felt; the host starts at the top */
function layoutTable(){
  /* landscape oval on a desktop, portrait oval on a phone */
  const mob = window.matchMedia("(max-width:760px)").matches;
  const rx = mob ? 34 : 41.5, ry = mob ? 43.5 : 38;
  document.querySelectorAll("[data-table]").forEach(wrap => {
    const seats = [...wrap.querySelectorAll(".pseat")], n = seats.length;
    if(!n) return;
    seats.forEach((el, i) => {
      const a = (-90 + (360 / n) * i) * Math.PI / 180;
      el.style.left = (50 + rx * Math.cos(a)).toFixed(2) + "%";
      el.style.top  = (50 + ry * Math.sin(a)).toFixed(2) + "%";
      el.style.animationDelay = (i * 55) + "ms";
    });
  });
}
window.addEventListener("resize", layoutTable);

/* ---------- clock control ---------- */
let AC = null;
function beep(isBreak){
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === "suspended") AC.resume();
    const t0 = AC.currentTime;
    (isBreak ? [523.25, 659.25, 784] : [659.25, 523.25]).forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.frequency.value = f; o.type = "sine";
      g.gain.setValueAtTime(.0001, t0 + i * .22);
      g.gain.exponentialRampToValueAtTime(.22, t0 + i * .22 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + i * .22 + .2);
      o.connect(g); g.connect(AC.destination);
      o.start(t0 + i * .22); o.stop(t0 + i * .22 + .22);
    });
  }catch(e){}
}

function clockAct(what){
  const c = clock();
  if(what === "toggle"){
    if(c.running){ c.left = Math.max(0, c.endsAt - Date.now()); c.running = false; c.endsAt = null; }
    else { const left = c.left === null ? lvlMs(c.idx) : c.left; c.endsAt = Date.now() + left; c.running = true; c.left = null; beep(false); }
  }
  if(what === "next" || what === "prev"){
    const i = Math.min(LEVELS.length - 1, Math.max(0, c.idx + (what === "next" ? 1 : -1)));
    c.idx = i; c.left = lvlMs(i);
    if(c.running) c.endsAt = Date.now() + c.left;
    if(c.running) c.left = null;
  }
  if(what === "reset"){ c.idx = 0; c.left = lvlMs(0); c.running = false; c.endsAt = null; }
  saveClock(c); render();
}

/* ticks down without re-rendering the whole tab */
function paintClock(){
  const c = clock();
  if(!c.running) return;
  const left = c.endsAt - Date.now();
  if(left <= 0){
    const nextIdx = Math.min(LEVELS.length - 1, c.idx + 1);
    const rolled = nextIdx !== c.idx;
    beep(!!(LEVELS[nextIdx] && LEVELS[nextIdx].brk));
    saveClock({ idx:nextIdx, left:lvlMs(nextIdx), endsAt:rolled ? Date.now() + lvlMs(nextIdx) : null, running:rolled });
    if(tab === "game" && sub === "clock") render();
    return;
  }
  const el = $("#clk"); if(el) el.textContent = mmss(left);
  const bar = $("#clkbar"), full = lvlMs(c.idx);
  if(bar && full) bar.style.width = ((1 - left / full) * 100).toFixed(1) + "%";
}

/* ---------- per-view wiring ---------- */
function wire(){
  layoutTable();

  /* the demo hand only ever runs on the Details felt */
  stopDemo();
  const demo = document.querySelector("[data-demo]");
  if(demo) setTimeout(() => runDemo(demo), 600);

  /* ---- the table: seat, bust, guests ---- */
  document.querySelectorAll("[data-seat]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.seat, n = night();
    if(n.seated.includes(id)){
      n.seated = n.seated.filter(x => x !== id);
      n.out = n.out.filter(x => x !== id);
      if(n.order) n.order = n.order.filter(x => x !== id);
    } else {
      n.seated.push(id);
      if(n.order) n.order.push(id);
    }
    saveNight(n); render();
  }));

  document.querySelectorAll("[data-bust]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.bust, n = night();
    n.out = n.out.includes(id) ? n.out.filter(x => x !== id) : n.out.concat(id);
    saveNight(n); render();
  }));

  const ag = document.querySelector("[data-addguest]"), gi = $("#guestName");
  const addGuest = () => {
    const name = (gi.value || "").trim();
    if(!name) return;
    const n = night();
    const id = "guest-" + (n.guests.length + 1) + "-" + name.toLowerCase().replace(/[^a-z0-9]/g, "");
    n.guests.push({ id, name });
    n.seated.push(id);
    if(n.order) n.order.push(id);
    saveNight(n); render();
  };
  if(ag) ag.addEventListener("click", addGuest);
  if(gi) gi.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); addGuest(); } });

  const sa = document.querySelector("[data-seatall]");
  if(sa) sa.addEventListener("click", () => {
    const n = night(); n.seated = roster().map(p => p.id); n.order = null; saveNight(n); render();
  });

  const sh = document.querySelector("[data-shuffle]");
  if(sh) sh.addEventListener("click", () => {
    const n = night(), o = n.seated.slice();
    for(let i = o.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; }
    n.order = o; saveNight(n); render();
  });

  const cn = document.querySelector("[data-clearnight]");
  if(cn) cn.addEventListener("click", () => {
    if(window.confirm("Clear the table — seating, knockouts and guests?")){
      saveNight({ seated:[], out:[], guests:[], order:null }); render();
    }
  });

  /* ---- game night: table or clock ---- */
  document.querySelectorAll("[data-sub]").forEach(b => b.addEventListener("click", () => {
    sub = b.dataset.sub; store.set("sub", sub); render();
  }));

  /* ---- the clock ---- */
  document.querySelectorAll("[data-clk]").forEach(b => b.addEventListener("click", () => clockAct(b.dataset.clk)));
  document.querySelectorAll("[data-jump]").forEach(b => b.addEventListener("click", () => {
    const c = clock(); c.idx = +b.dataset.jump; c.left = lvlMs(c.idx); c.running = false; c.endsAt = null;
    saveClock(c); render();
  }));

  /* leaderboard — record a win */
  const eb = document.querySelector("[data-editwins]");
  if(eb) eb.addEventListener("click", () => { store.set("editWins", !store.get("editWins", false)); render(); });

  document.querySelectorAll("[data-win]").forEach(b => b.addEventListener("click", () => {
    bumpWin(b.dataset.win, +b.dataset.by);
    render();
  }));

  /* leaderboard — a name opens that player's nights */
  document.querySelectorAll("[data-who]").forEach(b =>
    b.addEventListener("click", () => openSheet(b.dataset.who)));

}

/* ---------- a player's nights ----------
   The dated nights come from NIGHTS. Anything the count says they won
   before we started keeping dates is listed honestly as unrecorded. */
function openSheet(id){
  const p = R(id); if(!p) return;
  const card = $("#sheet-card"), sheet = $("#sheet");
  if(!card || !sheet) return;

  const wins = winsNow()[id] || 0;
  const dated = nightsWonBy(id);
  const undated = Math.max(0, wins - dated.length);

  const nights = dated.map(n => `
    <div class="nite">
      <div class="g">Game ${String(n.game).padStart(2, "0")}${n.field ? " · " + n.field.length + " seats" : ""}</div>
      <div class="d">${nightDate(n.iso)}</div>
      ${n.note ? `<p>${esc(n.note)}</p>` : ""}
      ${n.pot ? `<div class="take">Took home ${money(n.pot)}${
        n.second && R(n.second) ? " · " + esc(R(n.second).name.split(" ")[0]) + " second" : ""}</div>` : ""}
    </div>`).join("");

  const older = undated ? `
    <div class="nite unknown">
      <div class="g">Before we kept dates</div>
      <div class="d">${undated} night${undated === 1 ? "" : "s"} · date not recorded</div>
      <p>On the board, just not written down. Add them to NIGHTS if anyone remembers.</p>
    </div>` : "";

  card.innerHTML = `
    <div class="sheet-hd">
      <div>
        <h3 id="sheet-name">${esc(p.name)}</h3>
        <div class="c">${wins ? wins + " night" + (wins === 1 ? "" : "s") + " won · " + EVENT.season.toLowerCase() : "no nights won yet"}</div>
      </div>
      <button class="sheet-x" data-sheet-close aria-label="Close">✕</button>
    </div>
    <div class="sheet-bd">
      ${nights + older || `<div class="nite unknown"><div class="d">Nothing yet</div>
        <p>${esc(p.name.split(" ")[0])} is still chasing the first one.</p></div>`}
    </div>`;

  sheet.hidden = false;
  card.querySelectorAll("[data-sheet-close]").forEach(b => b.addEventListener("click", closeSheet));
  const x = card.querySelector(".sheet-x"); if(x) x.focus();
}

function closeSheet(){
  const sheet = $("#sheet");
  if(sheet) sheet.hidden = true;
}

/* ---------- global ---------- */
document.addEventListener("click", e => {
  if(e.target.closest("[data-sheet-close]")){ closeSheet(); return; }
  const b = e.target.closest("[data-tab]");
  if(b) go(b.dataset.tab);
});

document.addEventListener("keydown", e => {
  if(e.target.matches("input,textarea")) return;
  /* with a player's nights open, the keys belong to the dialog */
  const sheet = $("#sheet");
  if(sheet && !sheet.hidden){
    if(e.key === "Escape") closeSheet();
    return;
  }
  /* on the clock the keys drive the clock, everywhere else they change tab */
  if(tab === "game" && sub === "clock"){
    if(e.key === " "){ e.preventDefault(); clockAct("toggle"); return; }
    if(e.key === "ArrowRight"){ e.preventDefault(); clockAct("next"); return; }
    if(e.key === "ArrowLeft"){ e.preventDefault(); clockAct("prev"); return; }
    return;
  }
  const i = ALLTABS.findIndex(t => t[0] === tab);
  if(e.key === "ArrowRight"){ go(ALLTABS[(i + 1) % ALLTABS.length][0]); }
  if(e.key === "ArrowLeft"){ go(ALLTABS[(i - 1 + ALLTABS.length) % ALLTABS.length][0]); }
});

/* ==========================================================================
   THE DEMO HAND — runs itself on the Details felt and loops for ever.
   ========================================================================== */
let demoTimers = [], demoHand = 0;
const stopDemo = () => { demoTimers.forEach(clearTimeout); demoTimers = []; };
const at = (ms, fn) => demoTimers.push(setTimeout(fn, ms));

const cardHTML = (c, cls) => {
  const suit = c.slice(-1), rank = c.slice(0, -1);
  return `<span class="mc ${isRed(suit) ? "red" : ""} ${cls || ""}"><i>${rank}</i><em>${suit}</em></span>`;
};
const backHTML = cls => `<span class="mc down ${cls || ""}"><i></i><em></em></span>`;

/* a stack of chips sized to the money, biggest denomination at the bottom */
const CHIPCOLS = [[5000,"c-k"],[1000,"c-b"],[500,"c-g"],[100,"c-r"],[25,"c-w"]];
function chipStack(amount, max){
  let left = amount, out = [];
  CHIPCOLS.forEach(([val, cls]) => {
    let n = Math.floor(left / val); left -= n * val;
    while(n-- > 0 && out.length < max) out.push(`<i class="${cls}"></i>`);
  });
  if(!out.length) out.push('<i class="c-w"></i>');
  return out.join("");
}
const potStack = amount => {
  const cols = [];
  for(let i = 0; i < 4; i++) cols.push(`<div class="col">${chipStack(Math.round(amount / 4), 5)}</div>`);
  return cols.join("");
};

function runDemo(wrap){
  if(window.matchMedia("(prefers-reduced-motion:reduce)").matches) return;

  /* only the hands that really happened go on the felt. The made-up ones
     stay in HANDS for reference; drop `madeUp` from one to put it back in
     the loop. With a single real hand, that hand plays on repeat. */
  const reel = HANDS.filter(h => !h.madeUp);
  const H = (reel.length ? reel : HANDS)[demoHand % (reel.length || HANDS.length)];
  const seats = {};
  wrap.querySelectorAll(".pseat").forEach(el => seats[el.dataset.pid] = el);
  const ids = Object.keys(seats).filter(id => H.hole[id]);
  if(!ids.length) return;

  const boardEl = wrap.querySelector(".board-cards");
  const potEl   = wrap.querySelector(".pot b");
  const potStk  = wrap.querySelector(".potstack");
  const actEl   = wrap.querySelector(".act");
  if(!boardEl || !potEl || !actEl) return;

  const first = id => (R(id) || { name:id }).name.split(" ")[0];
  const say = (html, win) => { actEl.innerHTML = html; actEl.classList.toggle("win", !!win); };
  const clearGlow = () => ids.forEach(id => seats[id].classList.remove("acting"));

  /* pull each seat toward the middle of the felt so cards and chips
     sit on the table rather than on top of the player */
  const geom = id => {
    const el = seats[id], cs = getComputedStyle(el);
    const x = parseFloat(cs.left), y = parseFloat(cs.top);
    const cx = wrap.clientWidth / 2, cy = wrap.clientHeight / 2;
    const dx = cx - x, dy = cy - y, len = Math.hypot(dx, dy) || 1;
    return { x, y, ux:dx / len, uy:dy / len, d:len };
  };
  /* offsets scale with each seat's distance to the middle, so the cards land
     the same way in front of the top seats as the side ones */
  const place = () => {
    const mob = window.matchMedia("(max-width:760px)").matches;
    const anchor = mob ? 19 : 26, fCard = mob ? 0.30 : 0.36, fChip = mob ? 0.44 : 0.55;
    ids.forEach(id => {
      const g = geom(id), hand = seats[id].querySelector(".hand"), chip = seats[id].querySelector(".chip");
      hand.style.left = "50%";
      hand.style.top  = (anchor + g.uy * g.d * fCard) + "px";
      hand.style.marginLeft = (g.ux * g.d * fCard) + "px";
      chip.style.left = "50%";
      chip.style.top  = (anchor + g.uy * g.d * fChip) + "px";
      chip.style.marginLeft = (g.ux * g.d * fChip) + "px";
    });
  };

  let t = 0, pot = 0;

  /* --- reset --- */
  at(t, () => {
    wrap.classList.remove("playing");
    place();
    Object.keys(seats).forEach(id => { seats[id].classList.remove("fold","won","acting");
      const hand = seats[id].querySelector(".hand");
      if(hand) hand.innerHTML = "";
      const ch = seats[id].querySelector(".chip");
      if(ch){ ch.classList.remove("push"); ch.innerHTML = ""; }
    });
    /* busted earlier in the night: still at the table, out of the hand */
    (H.dim || []).forEach(id => { if(seats[id]) seats[id].classList.add("fold"); });
    /* not there at all that night: off the felt entirely */
    Object.keys(seats).forEach(id => seats[id].classList.remove("gone"));
    (H.away || []).forEach(id => { if(seats[id]) seats[id].classList.add("gone"); });
    boardEl.innerHTML = ""; potEl.textContent = "$0";
    if(potStk) potStk.innerHTML = ""; say("Shuffling up…");
  });
  t += 700;
  at(t, () => wrap.classList.add("playing"));
  t += 500;

  /* a hand that really happened says so before it deals */
  if(H.label){
    at(t, () => say(`<b>${H.label}</b>`));
    t += 1400;
  }

  /* --- deal, one card at a time round the table, twice --- */
  say("Dealing…");
  for(let round = 0; round < 2; round++){
    ids.forEach((id, i) => {
      at(t, () => {
        seats[id].querySelector(".hand").insertAdjacentHTML("beforeend", backHTML("deal"));
        if(round === 0 && i === 0) say("Dealing…");
      });
      t += 85;
    });
  }
  t += 350;

  /* --- the streets --- */
  const STREETS = ["", "The flop", "The turn", "The river"];
  H.streets.forEach((st, si) => {
    if(si > 0){
      const upto = si === 1 ? 3 : si + 2;
      at(t, () => say(`<b>${STREETS[si]}</b>`));
      t += 500;
      for(let k = (si === 1 ? 0 : upto - 1); k < upto; k++){
        at(t, () => boardEl.insertAdjacentHTML("beforeend", cardHTML(H.board[k], "turn")));
        t += 240;
      }
      t += 260;
    }
    st.acts.forEach(([id, act, amt]) => {
      if(!seats[id]) return;
      at(t, () => {
        clearGlow();
        seats[id].classList.add("acting");
        const ch = seats[id].querySelector(".chip");
        if(act === "folds"){
          seats[id].classList.add("fold");
          ch.classList.remove("push");
          say(`<b>${first(id)}</b>`);
        } else {
          if(amt){
            pot += amt;
            potEl.textContent = money(pot);
            if(potStk) potStk.innerHTML = potStack(pot);
            ch.innerHTML = `<span class="stk">${chipStack(amt, 5)}</span>${money(amt)}`;
            ch.classList.add("push");
          }
          say(`<b>${first(id)}</b>`);
        }
      });
      t += act === "folds" ? 380 : 760;
    });
    t += 300;
  });

  /* --- showdown --- */
  at(t, () => { clearGlow(); say("<b>Showdown</b>"); });
  t += 700;
  /* who is still in comes from the hand itself — reading the seats here would
     read the classes of whatever hand ran last, which is a hand too early */
  const mucked = new Set();
  H.streets.forEach(st => st.acts.forEach(([id, act]) => { if(act === "folds") mucked.add(id); }));
  ids.filter(id => !mucked.has(id)).forEach(id => {
    at(t, () => {
      seats[id].querySelector(".hand").innerHTML =
        H.hole[id].map(c => cardHTML(c, "turn")).join("");
    });
    t += 420;
  });
  t += 500;
  at(t, () => {
    const wid = H.winner;
    if(seats[wid]) seats[wid].classList.add("won");
    say(`<b>${first(wid)}</b> takes ${money(pot)} — ${H.with}`, true);
    /* every bet on the table slides across to whoever won it */
    if(seats[wid]){
      const wg = geom(wid);
      ids.forEach(id => {
        if(id === wid) return;
        const ch = seats[id].querySelector(".chip");
        if(!ch.classList.contains("push")) return;
        const g = geom(id);
        ch.style.transition = "transform .85s cubic-bezier(.35,.1,.25,1),opacity .5s .55s";
        ch.style.transform =
          `translate(calc(-50% + ${(wg.x - g.x).toFixed(0)}px),calc(-50% + ${(wg.y - g.y).toFixed(0)}px)) scale(.6)`;
        ch.style.opacity = "0";
      });
      const pw = wrap.querySelector(".potwrap");
      if(pw){ pw.style.transition = "transform .85s cubic-bezier(.35,.1,.25,1),opacity .5s .55s";
        pw.style.transform = `translate(${(wg.x - wrap.clientWidth / 2).toFixed(0)}px,${(wg.y - wrap.clientHeight / 2).toFixed(0)}px) scale(.55)`;
        pw.style.opacity = "0"; }
    }
  });
  t += 2600;
  /* the real hands get the last word */
  if(H.note){
    at(t, () => say(`<b>${H.note}</b>`, true));
    t += 2600;
  }
  at(t, () => {
    const pw = wrap.querySelector(".potwrap");
    if(pw){ pw.style.transition = "none"; pw.style.transform = ""; pw.style.opacity = ""; }
    ids.forEach(id => { const ch = seats[id].querySelector(".chip");
      ch.style.transition = "none"; ch.style.transform = ""; ch.style.opacity = ""; ch.classList.remove("push");
      requestAnimationFrame(() => ch.style.transition = ""); });
  });
  t += 1500;

  /* --- back to the details, then the next hand --- */
  at(t, () => { wrap.classList.remove("playing"); ids.forEach(id => seats[id].classList.remove("won","acting")); });
  t += 4200;
  at(t, () => { demoHand++; runDemo(wrap); });
}

/* ==========================================================================
   THE CURSOR
   ========================================================================== */
(function cursor(){
  if(!window.matchMedia("(pointer:fine)").matches) return;
  if(window.matchMedia("(prefers-reduced-motion:reduce)").matches) return;

  const ring = $("#cur"), dot = $("#curdot");
  if(!ring || !dot) return;
  document.documentElement.classList.add("cur-on");

  let mx = innerWidth / 2, my = innerHeight / 2, rx = mx, ry = my, seen = false;
  const HOT = 'a,button,input,label,[data-tab],[data-seat],[data-bust],[role="button"]';

  addEventListener("mousemove", e => {
    mx = e.clientX; my = e.clientY;
    if(!seen){ seen = true; rx = mx; ry = my; ring.style.opacity = "1"; dot.style.opacity = "1"; }
    ring.classList.toggle("hot", !!(e.target.closest && e.target.closest(HOT)));
  }, { passive:true });

  addEventListener("mouseleave", () => { ring.style.opacity = "0"; dot.style.opacity = "0"; });
  addEventListener("mouseenter", () => { ring.style.opacity = "1"; dot.style.opacity = "1"; });

  addEventListener("mousedown", e => {
    ring.classList.add("press");
    const r = document.createElement("div");
    r.className = "ripple";
    r.style.left = e.clientX + "px"; r.style.top = e.clientY + "px";
    document.body.appendChild(r);
    setTimeout(() => r.remove(), 650);
  });
  addEventListener("mouseup", () => ring.classList.remove("press"));

  /* the ring lags a little behind the dot — that's the whole trick */
  (function frame(){
    rx += (mx - rx) * 0.19;
    ry += (my - ry) * 0.19;
    ring.style.transform = `translate3d(${rx.toFixed(1)}px,${ry.toFixed(1)}px,0)`;
    dot.style.transform  = `translate3d(${mx}px,${my}px,0)`;
    requestAnimationFrame(frame);
  })();
})();
