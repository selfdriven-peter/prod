<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#09090f; --surface:#111118;
  --border:rgba(255,255,255,0.08);
  --text:#f0eeff; --muted:#7e7a9a; --muted2:#3d3a55;
  --curious:#f5c842; --caring:#ff5f7e; --constructive:#00e5a0; --chill:#7b6cff;
  --chill-bright:#9b8fff;
  --gold:#e8b84b; --felt:#35d68f;
  --pill:999px;
  --row-h:62px;
}

html,body{background:var(--bg);color:var(--text);height:100%}
body{font-family:'DM Sans',sans-serif;line-height:1.6;overflow:hidden}
a{color:inherit;text-decoration:none}
button,input{font-family:inherit;color:inherit}
::selection{background:var(--caring);color:#09090f}

/* ── stage: one viewport, never the page that scrolls ───────────────── */
.stage{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:max(20px,env(safe-area-inset-top)) 24px max(16px,env(safe-area-inset-bottom));
  max-width:900px;margin:0 auto}

/* ambient blobs */
.gblob{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
.gb1{width:420px;height:420px;background:var(--caring);top:-10%;left:-8%;opacity:.13}
.gb2{width:380px;height:380px;background:var(--chill);bottom:-14%;right:-10%;opacity:.16}
.gb3{width:300px;height:300px;background:var(--curious);top:34%;right:10%;opacity:.06}

/* ── masthead ───────────────────────────────────────────────────────── */
.top{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;
  gap:14px 20px;padding:14px 4px 18px;flex:0 0 auto;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1 1 300px}
.markdots{display:inline-flex;gap:5px}
.markdots i{width:9px;height:9px;border-radius:50%;display:block}
.markdots i:nth-child(1){background:var(--curious)}
.markdots i:nth-child(2){background:var(--caring)}
.markdots i:nth-child(3){background:var(--constructive)}
.markdots i:nth-child(4){background:var(--chill)}
@keyframes dotWave{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.markdots.wave i{animation:dotWave .7s ease}
.markdots.wave i:nth-child(2){animation-delay:.07s}
.markdots.wave i:nth-child(3){animation-delay:.14s}
.markdots.wave i:nth-child(4){animation-delay:.21s}

h1{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(28px,5.2vw,42px);
  font-weight:800;letter-spacing:-.04em;line-height:1}
h1 .accent{color:var(--caring)}
.sub{font-size:13.5px;color:var(--muted);max-width:44ch;line-height:1.5}

.tally{text-align:right;flex:0 0 auto;font-family:'JetBrains Mono',monospace}
.tally b{display:block;font-size:30px;font-weight:600;letter-spacing:-.04em;line-height:1;
  color:var(--text);font-variant-numeric:tabular-nums}
.tally span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted2)}

/* ── filter rail ────────────────────────────────────────────────────── */
.rail{position:relative;z-index:1;display:flex;align-items:center;gap:12px;flex:0 0 auto;
  padding:0 4px 12px;border-bottom:1px solid var(--border)}
.tabs{position:relative;display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;
  scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;z-index:1;display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;border:0;background:none;cursor:pointer;border-radius:var(--pill);
  font-family:'Bricolage Grotesque',sans-serif;font-size:12.5px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;
  transition:color .25s}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--bg)}
.tab em{font-style:normal;font-family:'JetBrains Mono',monospace;font-size:10px;
  font-weight:600;opacity:.62;font-variant-numeric:tabular-nums}
.tab:focus-visible{outline:2px solid var(--chill-bright);outline-offset:2px}
.glider{position:absolute;z-index:0;top:0;height:100%;border-radius:var(--pill);
  background:var(--text);transition:transform .38s cubic-bezier(.34,1.3,.5,1),width .38s cubic-bezier(.34,1.3,.5,1);
  will-change:transform,width}

.find{display:flex;align-items:center;gap:7px;flex:0 0 auto;padding:7px 12px;
  border:1px solid var(--border);border-radius:var(--pill);background:rgba(255,255,255,.02);
  transition:border-color .25s,background .25s}
.find:focus-within{border-color:rgba(155,143,255,.5);background:rgba(123,108,255,.07)}
.find svg{width:14px;height:14px;color:var(--muted2);flex:0 0 auto}
.find input{width:120px;border:0;background:none;outline:0;font-size:13px}
.find input::placeholder{color:var(--muted2)}

/* ── the board: the only scrolling region ───────────────────────────── */
.board{position:relative;z-index:1;flex:1 1 auto;min-height:0;overflow-y:auto;
  padding:14px 4px 20px;scrollbar-width:thin;scrollbar-color:var(--muted2) transparent;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 16px,#000 calc(100% - 22px),transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 16px,#000 calc(100% - 22px),transparent 100%)}
.board::-webkit-scrollbar{width:7px}
.board::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:99px}
.board::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}

/* cursor spotlight, sits behind the translucent rows */
.spot{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;
  background:radial-gradient(260px 160px at var(--mx,50%) var(--my,50%),
    rgba(155,143,255,.13),transparent 70%)}
.board.lit .spot{opacity:1}

/* group heading */
.grp{display:flex;align-items:center;gap:12px;padding:20px 2px 8px;
  animation:fadeUp .5s cubic-bezier(.22,1,.36,1) backwards;
  animation-delay:calc(var(--i) * 40ms)}
.grp:first-child{padding-top:2px}
.grp-label{font-family:'Bricolage Grotesque',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--tone,var(--muted))}
.grp-rule{flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.grp-count{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted2)}

/* ── a row ──────────────────────────────────────────────────────────── */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.row{position:relative;display:grid;align-items:center;gap:16px;
  grid-template-columns:34px 40px minmax(0,1fr) auto auto;
  min-height:var(--row-h);padding:10px 16px 10px 10px;margin-bottom:6px;
  border:1px solid var(--border);border-radius:16px;overflow:hidden;
  background:rgba(255,255,255,.022);
  animation:fadeUp .55s cubic-bezier(.22,1,.36,1) backwards;
  animation-delay:calc(var(--i) * 45ms);
  transition:transform .3s cubic-bezier(.34,1.4,.55,1),border-color .3s,background .3s}
/* the spine */
.row::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;
  border-radius:0 3px 3px 0;background:var(--tone);opacity:.5;
  transition:opacity .3s,top .3s,bottom .3s,width .3s}
/* the shine sweep */
.row::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.07) 48%,transparent 66%);
  transform:translateX(-60%);transition:opacity .3s}
.row:hover,.row:focus-visible{transform:translateX(5px);border-color:var(--tone-brd);
  background:var(--tone-dim);outline:0}
.row:hover::before,.row:focus-visible::before{opacity:1;top:0;bottom:0;width:4px}
.row:hover::after{opacity:1;animation:sweep .75s cubic-bezier(.3,0,.2,1)}
@keyframes sweep{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.row:focus-visible{box-shadow:0 0 0 2px var(--tone)}

.r-num{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;
  color:var(--muted2);text-align:center;font-variant-numeric:tabular-nums;
  transition:color .3s,transform .3s}
.row:hover .r-num{color:var(--tone);transform:translateY(-1px)}

.r-icon{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;
  justify-content:center;background:var(--tone-dim);color:var(--tone);
  border:1px solid var(--tone-brd);transition:transform .35s cubic-bezier(.34,1.5,.5,1),background .3s}
.r-icon svg{width:19px;height:19px}
.row:hover .r-icon{transform:rotate(-7deg) scale(1.08)}

.r-main{min-width:0}
.r-title{display:block;font-family:'Bricolage Grotesque',sans-serif;
  font-size:16.5px;font-weight:700;letter-spacing:-.02em;line-height:1.25;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .25s}
.row:hover .r-title{color:var(--tone)}
.r-line{display:block;font-size:12.8px;color:var(--muted);line-height:1.4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.r-tag{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;
  color:var(--muted);padding:4px 9px;border-radius:var(--pill);
  border:1px solid var(--border);background:rgba(255,255,255,.02);white-space:nowrap;
  transition:color .3s,border-color .3s}
.row:hover .r-tag{color:var(--tone);border-color:var(--tone-brd)}

.r-go{display:inline-flex;align-items:center;gap:7px;color:var(--tone);
  font-family:'Bricolage Grotesque',sans-serif;font-size:13px;font-weight:700;white-space:nowrap}
.r-go .lbl{max-width:0;overflow:hidden;opacity:0;
  transition:max-width .35s cubic-bezier(.22,1,.36,1),opacity .3s}
.row:hover .r-go .lbl{max-width:150px;opacity:1}
.r-go svg{width:15px;height:15px;flex:0 0 auto;transition:transform .3s}
.row:hover .r-go svg{transform:translateX(3px)}

/* tones */
.t-chill{--tone:#9b8fff;--tone-dim:rgba(123,108,255,.13);--tone-brd:rgba(123,108,255,.38)}
.t-caring{--tone:#ff5f7e;--tone-dim:rgba(255,95,126,.12);--tone-brd:rgba(255,95,126,.38)}
.t-gold{--tone:#e8b84b;--tone-dim:rgba(232,184,75,.12);--tone-brd:rgba(232,184,75,.4)}
.t-constructive{--tone:#00e5a0;--tone-dim:rgba(0,229,160,.11);--tone-brd:rgba(0,229,160,.36)}
.t-curious{--tone:#f5c842;--tone-dim:rgba(245,200,66,.12);--tone-brd:rgba(245,200,66,.38)}

.empty{padding:46px 8px;text-align:center;color:var(--muted);font-size:14px;
  animation:fadeUp .4s ease backwards}
.empty b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:19px;
  font-weight:800;color:var(--text);margin-bottom:6px;letter-spacing:-.02em}

/* ── footer ─────────────────────────────────────────────────────────── */
footer{position:relative;z-index:1;flex:0 0 auto;border-top:1px solid var(--border);
  padding:12px 4px 4px;display:flex;align-items:center;justify-content:space-between;
  gap:16px;font-size:12px;color:var(--muted2)}
.foot-tag{color:var(--muted)}
footer a{color:var(--muted2);transition:color .25s}
footer a:hover{color:var(--text)}
.kbd{font-family:'JetBrains Mono',monospace;font-size:10px;border:1px solid var(--border);
  border-radius:5px;padding:1px 5px;color:var(--muted2)}

/* ── a locked row: lives in the private vault, opens through the gate ── */
.row.is-locked{border-style:dashed}
.row.is-locked .r-icon{position:relative}
.row.is-locked .r-lock{position:absolute;right:-5px;bottom:-5px;width:18px;height:18px;
  border-radius:50%;display:grid;place-items:center;background:var(--bg);
  border:1px solid var(--tone-brd);color:var(--tone)}
.row.is-locked .r-lock svg{width:10px;height:10px}
.row.is-locked::before{background:repeating-linear-gradient(180deg,
  var(--tone) 0 5px,transparent 5px 10px)}
.row.is-locked .r-tag{border-style:dashed}
@keyframes keyhole{0%,100%{opacity:.55}50%{opacity:1}}
.row.is-locked:hover .r-lock{animation:keyhole 1.1s ease-in-out infinite}

/* ── narrow ─────────────────────────────────────────────────────────── */
@media(max-width:760px){
  .stage{padding-left:16px;padding-right:16px}
  .top{padding:8px 2px 14px;align-items:flex-start}
  .sub{display:none}
  .tally b{font-size:24px}
  .r-tag{display:none}
  .r-go .lbl{display:none}
  .row{grid-template-columns:26px 36px minmax(0,1fr) auto;gap:12px;padding-right:12px}
  .r-icon{width:36px;height:36px;border-radius:10px}
  .find input{width:84px}
  .rail{gap:8px}
}
@media(max-width:430px){
  .find{padding:7px 10px}
  .find input{width:0;min-width:0}
  .find:focus-within input{width:110px}
  .find input{transition:width .3s}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
  .row:hover{transform:none}
}

/* ── sign-in, in the top corner ──────────────────────────────────────────── */
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:9px;
  flex:0 0 auto;margin-left:auto}
.who{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
/* the hidden attribute must beat the display rules below it */
.who [hidden]{display:none !important}
.who-out,.who-in{display:flex;align-items:center;gap:7px}
.who-form{display:flex;gap:6px}
.who input{background:rgba(0,0,0,.3);border:1px solid var(--border,rgba(255,255,255,.08));
  border-radius:8px;padding:6px 10px;color:inherit;font:inherit;font-size:.78rem;width:7.6rem}
.who input:focus{outline:2px solid var(--chill,#7b6cff);outline-offset:1px}
.who button{background:var(--chill,#7b6cff);color:#0b0b12;border:0;border-radius:8px;
  padding:6px 12px;font:inherit;font-size:.76rem;font-weight:700;cursor:pointer;line-height:1.3}
.who button:disabled{opacity:.5;cursor:default}
.who-in button{background:transparent;color:var(--muted,#7e7a9a);
  border:1px solid var(--border,rgba(255,255,255,.08));font-weight:500;padding:5px 9px}
.who-in button:hover{color:var(--text,#f0eeff)}
.who-dot{width:7px;height:7px;border-radius:50%;background:var(--constructive,#00e5a0);flex:none}
.who-copy{font-size:.78rem;color:var(--muted,#7e7a9a);max-width:11rem;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.who-copy b{color:var(--text,#f0eeff);font-weight:600}
.who-msg{font-size:.72rem;color:var(--caring,#ff5f7e);text-align:right;max-width:13rem}
.who-msg:empty{display:none}

/* a locked row that is not yours: visible, but plainly not for you */
.row.is-notyours{opacity:.32;filter:grayscale(1);cursor:default;pointer-events:none}
.row.is-notyours .r-go{visibility:hidden}
@media (prefers-reduced-motion:no-preference){
  .row{transition:opacity .25s ease,filter .25s ease}
}
@media (max-width:760px){
  .top-right{flex-direction:row;align-items:center;justify-content:space-between;
    width:100%;margin-left:0;gap:12px}
  .top-right .tally{display:flex;align-items:baseline;gap:6px;text-align:left}
  .top-right .tally b{font-size:20px}
  .who{align-items:flex-end}
}
@media (max-width:430px){
  .who input{width:6.8rem}
  .who button{padding:6px 10px}
}

/* ── the field: points that morph between shapes, behind everything ──── */
#field{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.floor{position:fixed;left:-50%;right:-50%;bottom:-10%;height:46%;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(123,108,255,.28) 1px,transparent 1px),
    linear-gradient(90deg,rgba(123,108,255,.28) 1px,transparent 1px);
  background-size:64px 64px;transform:perspective(520px) rotateX(64deg);transform-origin:center top;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 65%,transparent);
  mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 65%,transparent);
  animation:floor 3.2s linear infinite;opacity:.55}
@keyframes floor{to{background-position:0 64px}}
/* what the field is doing, riding just under the shape */
.fieldtag{position:fixed;left:0;top:0;z-index:0;pointer-events:none;white-space:nowrap;
  font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tag,var(--muted));padding:5px 11px;border-radius:var(--pill);
  background:rgba(9,9,15,.66);border:1px solid rgba(255,255,255,.07);
  transition:color .4s,opacity .4s;will-change:transform}
.fieldtag b{color:var(--muted2);font-weight:600;margin-right:6px}

/* rows and controls turn to frosted glass so the field reads through */

  backdrop-filter:blur(10px) saturate(140%)}

<body>

<div class="gblob gb1"></div><div class="gblob gb2"></div><div class="gblob gb3"></div>
<div class="floor" aria-hidden="true"></div>
<canvas id="field" aria-hidden="true"></canvas>
<div class="fieldtag" id="fieldTag" aria-hidden="true"><b>01</b><span>four Cs</span></div>

<div class="stage">

  <header class="top">
    <div class="brand">
      <span class="markdots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <h1>A few <span class="accent">pages.</span></h1>
      <p class="sub">selfdriven things, plus a few one-offs made for particular people. All parked here so the links keep working.</p>
    </div>
    <div class="top-right">
      <div class="tally"><b id="tally">0</b><span>pages</span></div>
      <div class="who" id="who">
        <div class="who-out" id="whoOut">
          <form class="who-form" id="whoForm" autocomplete="off">
            <input id="whoPw" type="password" placeholder="Password" aria-label="Your password"
                   autocomplete="current-password" spellcheck="false">
            <button type="submit" id="whoBtn">Sign in</button>
          </form>
        </div>
        <div class="who-in" id="whoIn" hidden>
          <span class="who-dot" aria-hidden="true"></span>
          <span class="who-copy"><b id="whoName">—</b></span>
          <button type="button" id="whoAddBtn" title="Sign in with another password">+</button>
          <button type="button" id="whoOutBtn">Out</button>

      <svg aria-hidden="true"><use href="#ic-search"/></svg>
      <input id="find" type="search" placeholder="Filter…" aria-label="Filter pages by name" autocomplete="off">
    </label>
  </nav>

  <main class="board" id="board" role="tabpanel" aria-live="polite">
    <div class="spot" aria-hidden="true"></div>
    <div id="list"></div>
  </main>

  <footer>
    <span class="foot-tag">Curious · Caring · Constructive · Chill</span>
    <span>An initiative of the <a href="https://selfdriven.foundation" target="_blank" rel="noopener">selfdriven Foundation</a></span>
  </footer>

</div>

<!-- the catalogue, generated by tools/catalogue.py from the pages themselves -->
<script src="data/catalogue.js"></script>

<script>
/* ════════════════════════════════════════════════════════════════════════
   THE CATALOGUE IS GENERATED — there is nothing to edit in this file.

   Every page declares what it is in its own <head>:

       <meta name="sd:title" content="Poker Night">
       <meta name="sd:group" content="other">
       <meta name="sd:tone"  content="gold">
       ...

   tools/catalogue.py scans the public pages AND the private vault, then
   writes docs/data/catalogue.js. To add a page:

       1. write it — start from templates/page.html
       2. python3 tools/catalogue.py
       3. commit and push

   Or run /publish-page and the skill does all three.

   Public vs locked is decided by WHICH REPO the file sits in, never by a
   tag — so a page cannot be published by mistyping something.
   ════════════════════════════════════════════════════════════════════════ */

var CATALOGUE = window.CATALOGUE || null;
var GATE   = CATALOGUE ? (CATALOGUE.gate   || '') : '';
var GROUPS = CATALOGUE ? (CATALOGUE.groups || []) : [];
var SITES  = CATALOGUE ? (CATALOGUE.sites  || []) : [];

(function(){
  var tabsEl  = document.getElementById('tabs'),
      glider  = document.getElementById('glider'),
      listEl  = document.getElementById('list'),
      boardEl = document.getElementById('board'),
      findEl  = document.getElementById('find'),
      tallyEl = document.getElementById('tally'),
      dots    = document.getElementById('dots');

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var active = 'all', query = '';

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function visible(){
    var q = query.trim().toLowerCase();
    return SITES.filter(function(s){
      if(active !== 'all' && s.group !== active) return false;
      if(!q) return true;
      return (s.title + ' ' + s.line + ' ' + s.tag + ' ' + s.group).toLowerCase().indexOf(q) > -1;
    });
  }

  /* ── tabs ──────────────────────────────────────────────────────────── */
  function buildTabs(){
    var defs = [{id:'all', label:'All'}].concat(GROUPS);
    defs.forEach(function(g){
      var n = g.id === 'all' ? SITES.length
            : SITES.filter(function(s){ return s.group === g.id; }).length;
      if(g.id !== 'all' && n === 0) return;
      var b = document.createElement('button');
      b.className = 'tab'; b.type = 'button'; b.dataset.id = g.id;
      b.setAttribute('role','tab');
      b.setAttribute('aria-selected', g.id === active ? 'true' : 'false');
      b.innerHTML = esc(g.label) + ' <em>' + n + '</em>';
      b.addEventListener('click', function(){ select(g.id); });
      tabsEl.appendChild(b);
    });
    tabsEl.addEventListener('keydown', function(e){
      if(e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      var all = [].slice.call(tabsEl.querySelectorAll('.tab'));
      var i = all.indexOf(document.activeElement);
      if(i < 0) return;
      e.preventDefault();
      var next = all[(i + (e.key === 'ArrowRight' ? 1 : all.length - 1)) % all.length];
      next.focus(); select(next.dataset.id);
    });
  }

  function moveGlider(){
    var on = tabsEl.querySelector('.tab[aria-selected="true"]');
    if(!on) return;
    glider.style.width = on.offsetWidth + 'px';
    glider.style.transform = 'translateX(' + on.offsetLeft + 'px)';
  }

  function select(id){
    if(id === active) return;
    active = id;
    [].forEach.call(tabsEl.querySelectorAll('.tab'), function(t){
      t.setAttribute('aria-selected', t.dataset.id === id ? 'true' : 'false');
    });
    moveGlider(); render();
    boardEl.scrollTop = 0;
    document.dispatchEvent(new CustomEvent('board-tab', { detail: id }));
  }

  /* ── who is looking ────────────────────────────────────────────────────
     The index cannot read the password the gate remembers — different origin.
     So it asks the gate "which project does this password open?" and keeps
     only the answer ("peter"). Purely cosmetic: it decides what is dimmed,
     never what can be opened. Every page still goes through the real check.
     ──────────────────────────────────────────────────────────────────── */
  var WHO_KEY = 'pp_who';
  var who = [];          /* every project key you have signed in to */
  try {
    var raw = localStorage.getItem(WHO_KEY);
    if(raw) who = raw.charAt(0) === '[' ? (JSON.parse(raw) || []) : [raw];
  } catch(e){ who = []; }
  function saveWho(){ try { localStorage.setItem(WHO_KEY, JSON.stringify(who)); } catch(e){} }
  /* tell the field what sign-in is doing; it only draws, never decides */
  function stir(state){ document.dispatchEvent(new CustomEvent('who-state', { detail: state })); }
  function knows(k){ return who.indexOf(k) !== -1; }

  var whoOut  = document.getElementById('whoOut'),
      whoIn   = document.getElementById('whoIn'),
      whoForm = document.getElementById('whoForm'),
      whoPw   = document.getElementById('whoPw'),
      whoBtn  = document.getElementById('whoBtn'),
      whoName = document.getElementById('whoName'),
      whoMsg  = document.getElementById('whoMsg'),
      whoOutB = document.getElementById('whoOutBtn'),
      whoAddB = document.getElementById('whoAddBtn');

  /* "Add another" drops you back to the password box without losing the keys
     you already hold — poker has its own password, so you can hold both. */
  whoAddB.addEventListener('click', function(){
    whoOut.hidden = false; whoMsg.textContent = ''; whoPw.focus();
  });

  function paintWho(){
    var on = who.length > 0;
    whoOut.hidden = on; whoIn.hidden = !on;
    if(on) whoName.textContent = who.join(' + ');
  }

  whoForm.addEventListener('submit', async function(e){
    e.preventDefault();
    var pw = whoPw.value;
    if(!pw || !GATE) return;
    whoBtn.disabled = true; whoBtn.textContent = 'Checking…'; whoMsg.textContent = '';
    stir('checking');
    var outcome = 'bad';
    try{
      var res = await fetch(GATE + '/whoami', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ password: pw })
      });
      var data = {}; try { data = await res.json(); } catch(e){}
      if(res.ok && data.key){
        if(!knows(data.key)) who.push(data.key);
        saveWho();
        whoPw.value = '';
        paintWho(); render();
        outcome = 'ok';
      } else {
        whoMsg.textContent = data.error || 'That password was not recognised.';
      }
    } catch(err){
      whoMsg.textContent = 'Could not reach the gate. Try again.';
    }
    whoBtn.disabled = false; whoBtn.textContent = 'Sign in';
    stir(outcome);
  });

  whoOutB.addEventListener('click', function(){
    who = [];
    try { localStorage.removeItem(WHO_KEY); } catch(e){}
    whoMsg.textContent = ''; paintWho(); render();
  });

  /* ── the board ─────────────────────────────────────────────────────── */
  function rowHTML(s, i, n){
    var href = s.locked ? (GATE + '/#' + esc(s.page)) : esc(s.href);
    /* signed in, and this locked page belongs to someone else */
    var notYours = s.locked && who.length && s.owner && !knows(s.owner);
    return '<a class="row t-' + s.tone + (s.locked ? ' is-locked' : '')
      + (notYours ? ' is-notyours' : '')
      + '" href="' + (notYours ? '#' : href) + '"'
      + (notYours ? ' aria-disabled="true" tabindex="-1"' : '')
      + (s.locked ? ' rel="nofollow"' : '')
      + ' style="--i:' + i + '">'
      + '<span class="r-num">' + (n < 10 ? '0' : '') + n + '</span>'
      + '<span class="r-icon"><svg aria-hidden="true"><use href="#' + esc(s.icon) + '"/></svg>'
        + (s.locked ? '<span class="r-lock"><svg aria-hidden="true"><use href="#ic-lock"/></svg></span>' : '')
      + '</span>'
      + '<span class="r-main">'
        + '<span class="r-title" data-text="' + esc(s.title) + '">' + esc(s.title) + '</span>'
        + '<span class="r-line">' + esc(s.line) + '</span>'
      + '</span>'
      + '<span class="r-tag">' + esc(s.locked ? (notYours ? 'not yours' : 'locked') : s.tag) + '</span>'
      + '<span class="r-go"><span class="lbl">' + esc(s.locked ? (s.cta || 'Unlock') : s.cta) + '</span>'
        + '<svg aria-hidden="true"><use href="#ic-arrow-right"/></svg></span>'
      + '</a>';
  }

  function render(){
    var rows = visible(), html = '', i = 0, n = 0;

    if(!CATALOGUE){
      listEl.innerHTML = '<div class="empty"><b>No catalogue.</b>'
        + 'docs/data/catalogue.js did not load. Run '
        + '<code>python3 tools/catalogue.py</code> to build it.</div>';
      tallyEl.textContent = '0';
      return;
    }

    if(!rows.length){
      listEl.innerHTML = '<div class="empty"><b>Nothing under that.</b>'
        + 'No page here matches ' + (query ? '“' + esc(query) + '”' : 'this tab') + ' yet.</div>';
      tallyEl.textContent = '0';
      return;
    }

    if(active === 'all'){
      GROUPS.forEach(function(g){
        var inGroup = rows.filter(function(s){ return s.group === g.id; });
        if(!inGroup.length) return;
        html += '<div class="grp t-' + g.tone + '" style="--i:' + (i++) + '">'
             +  '<span class="grp-label">' + esc(g.label) + '</span>'
             +  '<span class="grp-rule"></span>'
             +  '<span class="grp-count">' + inGroup.length + '</span></div>';
        inGroup.forEach(function(s){ html += rowHTML(s, i++, ++n); });
      });
    } else {
      rows.forEach(function(s){ html += rowHTML(s, i++, ++n); });
    }

    listEl.innerHTML = html;
    countUp(rows.length);
    if(!reduced) scrambleTitles();
  }

  /* ── the departure-board flicker on the titles ─────────────────────── */
  var GLYPH = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&/·';
  function scrambleTitles(){
    var titles = [].slice.call(listEl.querySelectorAll('.r-title')).slice(0, 12);
    titles.forEach(function(el, idx){
      var final = el.dataset.text, start = performance.now() + idx * 45, dur = 320;
      el.textContent = '';
      (function tick(now){
        if(now < start){ requestAnimationFrame(tick); return; }
        var p = Math.min(1, (now - start) / dur),
            reveal = Math.floor(p * final.length), out = '';
        for(var c = 0; c < final.length; c++){
          out += (c < reveal || final[c] === ' ')
               ? final[c] : GLYPH[(Math.random() * GLYPH.length) | 0];
        }
        el.textContent = out;
        if(p < 1) requestAnimationFrame(tick); else el.textContent = final;
      })(performance.now());
    });
  }

  /* ── the tally ticks to the new number ─────────────────────────────── */
  function countUp(to){
    var from = parseInt(tallyEl.textContent, 10) || 0;
    if(reduced || from === to){ tallyEl.textContent = to; return; }
    var t0 = performance.now(), dur = 420;
    (function tick(now){
      var p = Math.min(1, (now - t0) / dur);
      tallyEl.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
      if(p < 1) requestAnimationFrame(tick);
    })(t0);
  }

  /* ── cursor spotlight ──────────────────────────────────────────────── */
  boardEl.addEventListener('pointermove', function(e){
    var r = boardEl.getBoundingClientRect();
    boardEl.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    boardEl.style.setProperty('--my', (e.clientY - r.top + boardEl.scrollTop) + 'px');
    boardEl.classList.add('lit');
  });
  boardEl.addEventListener('pointerleave', function(){ boardEl.classList.remove('lit'); });

  /* ── filter box ────────────────────────────────────────────────────── */
  findEl.addEventListener('input', function(){ query = findEl.value; render(); });
  document.addEventListener('keydown', function(e){
    if(e.key === '/' && document.activeElement !== findEl){ e.preventDefault(); findEl.focus(); }
    if(e.key === 'Escape' && document.activeElement === findEl){
      findEl.value = ''; query = ''; render(); findEl.blur();
    }
  });

  /* ── the four dots ─────────────────────────────────────────────────── */
  function wave(){ dots.classList.remove('wave'); void dots.offsetWidth; dots.classList.add('wave'); }
  dots.addEventListener('mouseenter', wave);

  paintWho(); buildTabs(); render();
  requestAnimationFrame(moveGlider);
  window.addEventListener('resize', moveGlider);
  window.addEventListener('load', function(){ moveGlider(); wave(); });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(moveGlider);
})();
</script>

<script>
/* ── the field ────────────────────────────────────────────────────────────
   A couple of thousand points in 3D, drawn on a 2D canvas, that morph from
   one shape to the next. Same engine idea as the TrialThread hero, in the
   4Cs palette. No libraries. It only draws; it never decides anything.

     var f = Field(canvas, { anchor: function(name){ return {x, y, r, a}; } });
     f.set('rings');            // a shape, in the 4Cs
     f.set('spade', '#e8b84b'); // a shape, in one tone
     f.pulse(.4);               // a kick outwards that settles back
   ──────────────────────────────────────────────────────────────────── */
var Field = (function(){
  var TAU = Math.PI * 2;
  var C = {
    curious:[245,200,66], caring:[255,95,126], constructive:[0,229,160],
    chill:[155,143,255], white:[240,238,255], dim:[60,56,92]
  };
  var FOUR = [C.curious, C.caring, C.constructive, C.chill];

  function rnd(a){ return (Math.random() * 2 - 1) * (a || 1); }
  function inBall(r){ var x, y, z; do { x = rnd(); y = rnd(); z = rnd(); } while(x*x + y*y + z*z > 1); return [x*r, y*r, z*r]; }
  function fib(i, n){ var y = 1 - 2 * (i + .5) / n, r = Math.sqrt(1 - y*y), th = i * 2.399963; return [Math.cos(th)*r, y, Math.sin(th)*r]; }
  function hash(i){ var s = Math.sin(i * 12.9898) * 43758.5453; return s - Math.floor(s); }
  function rn(i, n){ return hash(i * 7.13 + n * 1.37) * 2 - 1; }
  function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
  function ease(t){ return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; }
  function mix(a, b, t){ return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, a[2] + (b[2]-a[2])*t]; }
  function rgb(hex){ var n = parseInt(String(hex).replace('#', ''), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function paint(c, col){ c[0] = col[0]; c[1] = col[1]; c[2] = col[2]; }

  function build(N, fn){
    var p = new Float32Array(N*3), c = new Float32Array(N*3), s = new Float32Array(N), m = {};
    for(var i = 0; i < N; i++){
      var o = fn(i, m, N);
      p[i*3] = o.p[0]; p[i*3+1] = o.p[1]; p[i*3+2] = o.p[2];
      c[i*3] = o.c[0]; c[i*3+1] = o.c[1]; c[i*3+2] = o.c[2];
      s[i] = o.s || 1;
    }
    return { p:p, c:c, s:s, m:m };
  }

  /* fill a flat 2D outline with points, given an inside() test */
  function slab(N, inside, depth, colour){
    return build(N, function(i){
      var x, y, n = 0;
      do { x = rnd(); y = rnd(); n++; } while(!inside(x, y) && n < 60);
      return { p:[x, y, rnd(depth)], c:colour(i, x, y), s:1 };
    });
  }

  /* ── the shapes. Each takes a tone (or null for the 4Cs) ────────────── */
  var SHAPES = {

    /* four tilted orbits, one per C, round a small bright core */
    rings: function(t){ return { spin:.12, build:function(N){ return build(N, function(i, m){
        m.r = m.r || new Uint8Array(N); m.a = m.a || new Float32Array(N); m.j = m.j || new Float32Array(N);
        var core = i % 9 === 0, r = core ? 4 : i % 4;
        m.r[i] = r; m.a[i] = Math.random() * TAU; m.j[i] = rnd(.04);
        return { p:[0,0,0], c: core ? C.white : (t ? (r % 2 ? t : mix(t, C.white, .45)) : FOUR[r]), s: core ? .8 : 1.05 };
      }); },
      anim:function(i, v, c, te, D){
        var m = D.m, r = m.r[i];
        if(r === 4){ var q = fib(i % 300, 300), b = .2 + .03 * Math.sin(te * 3); v[0] = q[0]*b; v[1] = q[1]*b; v[2] = q[2]*b; return; }
        var a = m.a[i] + te * (.35 + r * .07) * (r % 2 ? -1 : 1), R = 1 + m.j[i];
        var tilt = r * TAU / 8 + .3, tw = r * .9;
        var x = Math.cos(a) * R, z = Math.sin(a) * R;
        var y1 = -z * Math.sin(tilt), z1 = z * Math.cos(tilt);
        v[0] = x * Math.cos(tw) + z1 * Math.sin(tw); v[1] = y1; v[2] = -x * Math.sin(tw) + z1 * Math.cos(tw);
      } }; },

    /* the thread: a double helix with rungs, flowing upwards */
    helix: function(t){ return { spin:.35, build:function(N){ return build(N, function(i, m){
        m.k = m.k || new Uint8Array(N); m.u = m.u || new Float32Array(N); m.w = m.w || new Float32Array(N); m.j = m.j || new Float32Array(N*3);
        var k = i % 5 < 2 ? 0 : i % 5 < 4 ? 1 : 2;
        m.k[i] = k; m.u[i] = Math.random(); m.w[i] = Math.random(); m.j.set(inBall(.04), i*3);
        return { p:[0,0,0], c: k === 2 ? C.white : k ? (t || C.chill) : (t ? mix(t, C.white, .5) : C.caring), s: k === 2 ? .7 : 1.1 };
      }); },
      anim:function(i, v, c, te, D){
        var m = D.m, k = m.k[i], s = (m.u[i] + te * .02) % 1, L = 2.6, R = .52, x, y, z;
        if(k < 2){ var a = s * TAU * 2.2 + (k ? Math.PI : 0); x = Math.cos(a) * R; z = Math.sin(a) * R; y = (s - .5) * L; }
        else {
          var rung = Math.floor(s * 26), rs = rung / 26, b = rs * TAU * 2.2, w = m.w[i], x0 = Math.cos(b) * R, z0 = Math.sin(b) * R;
          x = x0 - 2 * x0 * w; z = z0 - 2 * z0 * w; y = (rs - .5) * L;
          paint(c, t ? (rung % 4 === 0 ? C.white : t) : FOUR[rung % 4]);
        }
        x += m.j[i*3]; y += m.j[i*3+1]; z += m.j[i*3+2];
        var ct = Math.cos(-.5), st = Math.sin(-.5);
        v[0] = x * ct - y * st; v[1] = x * st + y * ct; v[2] = z;
        if(k < 2 && ((s * 3 - te * .4) % 1 + 1) % 1 < .05) paint(c, [255,250,240]);
      } }; },

    /* a trefoil knot, the colour running round it */
    knot: function(t){ return { spin:.22, build:function(N){ return build(N, function(i, m){
        m.u = m.u || new Float32Array(N); m.j = m.j || new Float32Array(N*3);
        m.u[i] = i / N; m.j.set(inBall(.11), i*3);
        return { p:[0,0,0], c:C.white, s:1 };
      }); },
      anim:function(i, v, c, te, D){
        var m = D.m, u = (m.u[i] + te * .015) % 1, a = u * TAU, r = Math.cos(3 * a) + 2.2;
        v[0] = r * Math.cos(2 * a) * .36 + m.j[i*3];
        v[1] = -Math.sin(3 * a) * .5 + m.j[i*3+1];
        v[2] = r * Math.sin(2 * a) * .36 + m.j[i*3+2];
        var f = u * 4, k = Math.floor(f);
        paint(c, t ? mix(t, C.white, .5 + .5 * Math.sin(f * Math.PI)) : mix(FOUR[k % 4], FOUR[(k + 1) % 4], f - k));
      } }; },

    /* a breathing globe, banded in the four colours */
    globe: function(t){ return { spin:.18, build:function(N){ return build(N, function(i){
        var q = fib(i, N), band = Math.floor((q[1] + 1) * 2) % 4;
        return { p:q, c: hash(i) < .13 ? C.white : (t || FOUR[band]), s:.95 };
      }); },
      anim:function(i, v, c, te){
        var b = 1 + .06 * Math.pow(Math.max(0, Math.sin(te * 2.6)), 10) + .025 * Math.sin(te * 1.1 + v[1] * 3);
        v[0] *= b; v[1] *= b; v[2] *= b;
      } }; },

    /* a padlock. Deterministic, so lock, checking and unlock morph into
       each other without the points reshuffling */
    lock: function(t, mode){ var tone = t || C.chill; return { spin: mode === 'checking' ? 3.2 : 0, mode:mode,
      build:function(N){ return build(N, function(i, m){
        m.k = m.k || new Uint8Array(N);
        var p, c = tone, s = 1, k;
        if(hash(i + 3) < .34){
          k = 0;
          var tube = [rn(i,1) * .06, rn(i,2) * .06, rn(i,3) * .06];
          if(hash(i + 5) < .35){ var side = rn(i,4) < 0 ? -1 : 1; p = [side * .42 + tube[0], .25 + rn(i,5) * .15 + tube[1], tube[2]]; }
          else { var a = (rn(i,6) + 1) / 2 * Math.PI; p = [Math.cos(a) * .42 + tube[0], .4 + Math.sin(a) * .42 + tube[1], tube[2]]; }
          c = mix(tone, C.white, .35);
        } else {
          k = 1;
          var x = rn(i,7) * .66, y = -.35 + rn(i,8) * .48, z = rn(i,9) * .22, f = Math.floor(hash(i + 11) * 3);
          if(f === 0) x = x < 0 ? -.66 : .66; else if(f === 1) y = y < -.35 ? -.83 : .13; else z = z < 0 ? -.22 : .22;
          p = [x, y, z];
          var dy = y + .3;
          if(f === 2 && z < 0 && (x*x + dy*dy < .02 || (Math.abs(x) < .045 && dy < 0 && dy > -.32))){ c = C.white; s = 1.6; }
        }
        m.k[i] = k; return { p:p, c:c, s:s };
      }); },
      anim:function(i, v, c, te, D){
        if(this.mode !== 'open') return;
        var lift = ease(clamp(te / .55, 0, 1)) * .36, burst = Math.max(0, te - .65);
        if(D.m.k[i] === 0) v[1] += lift;
        if(burst){ var g = 1 + burst * burst * 2.6; v[0] *= g; v[1] *= g; v[2] *= g; paint(c, mix(c, C.constructive, clamp(burst * 2, 0, 1))); }
      } }; },

    /* not that one: a cloud that shudders, then settles */
    scatter: function(t){ var tone = t || C.caring; return { spin:.05, build:function(N){ return build(N, function(i){
        return { p:inBall(1.45), c: hash(i) < .25 ? C.white : tone, s:.9 };
      }); },
      anim:function(i, v, c, te){ var sh = Math.exp(-te * 2.4) * .22; v[0] += Math.sin(te * 42 + i) * sh; v[1] += Math.cos(te * 37 + i) * sh * .4; } }; },

    /* ── one shape per page icon ── */
    spade: function(t){ var tone = t || C.curious; return { spin:.3, build:function(N){
        return slab(N, function(x, y){
          var lobe = (Math.abs(x) - .38) * (Math.abs(x) - .38) + (y + .08) * (y + .08) < .2;
          var top = y > -.08 && y < .95 && Math.abs(x) < (.95 - y) * .86;
          var stem = y < -.2 && y > -.95 && Math.abs(x) < .08 + (-.2 - y) * .4;
          return lobe || top || stem;
        }, .1, function(i){ return hash(i) < .18 ? C.white : tone; });
      } }; },

    eightball: function(t){ var tone = t || C.chill; return { spin:0, build:function(N){ return build(N, function(i){
        var q = fib(i, N), col = mix(tone, C.dim, .35), s = .9;
        if(q[2] < -.8){
          var a = q[0] / .6, b = q[1] / .6, top = Math.hypot(a, b - .12), bot = Math.hypot(a, b + .14);
          col = (Math.abs(top - .1) < .035 || Math.abs(bot - .13) < .035) ? tone : C.white; s = 1.2;
        }
        return { p:[q[0], q[1], q[2]], c:col, s:s };
      }); },
      anim:function(i, v, c, te){ var w = Math.sin(te * 1.6) * .08 * Math.exp(-te * .2); v[0] += w * v[1]; } }; },

    compass: function(t){ var tone = t || C.chill; return { spin:0, build:function(N){ return build(N, function(i, m){
        m.k = m.k || new Uint8Array(N);
        var h = hash(i + 1), k, p, c = tone;
        if(h < .5){ k = 0; var a = Math.random() * TAU, rr = 1 + rnd(.03); p = [Math.cos(a) * rr, Math.sin(a) * rr, rnd(.05)]; if(Math.abs(Math.sin(a * 2)) < .05){ c = C.white; } }
        else if(h < .62){ k = 0; var b = Math.random() * TAU; p = [Math.cos(b) * .78, Math.sin(b) * .78, 0]; c = mix(tone, C.dim, .5); }
        else { k = 1; var u = Math.random(), w = rnd() * (1 - Math.abs(u * 2 - 1)) * .14, y = (u * 2 - 1) * .74; p = [w, y, rnd(.03)]; c = y > 0 ? C.white : tone; }
        m.k[i] = k; return { p:p, c:c, s:1 };
      }); },
      anim:function(i, v, c, te, D){
        if(D.m.k[i] !== 1) return;
        var a = .9 * Math.sin(te * 1.4) * Math.exp(-te * .35) + .15 * Math.sin(te * .5), ca = Math.cos(a), sa = Math.sin(a), x = v[0], y = v[1];
        v[0] = x * ca - y * sa; v[1] = x * sa + y * ca;
      } }; },

    sparkles: function(t){ var tone = t || C.constructive; return { spin:.2, build:function(N){ return build(N, function(i, m){
        m.k = m.k || new Uint8Array(N);
        var k = hash(i + 2) < .74 ? 0 : hash(i + 4) < .6 ? 1 : 2, sc = [1, .3, .2][k], ox = [0, .9, -.85][k], oy = [0, .75, -.72][k], x, y, n = 0;
        do { x = rnd(); y = rnd(); n++; } while(Math.sqrt(Math.abs(x)) + Math.sqrt(Math.abs(y)) > 1 && n < 60);
        m.k[i] = k;
        return { p:[ox + x * sc, oy + y * sc, rnd(.08)], c: k ? C.white : (hash(i) < .15 ? C.white : tone), s:k ? 1.2 : 1 };
      }); },
      anim:function(i, v, c, te, D){
        var k = D.m.k[i]; if(!k) { var b = 1 + .04 * Math.sin(te * 2); v[0] *= b; v[1] *= b; return; }
        var ox = k === 1 ? .9 : -.85, oy = k === 1 ? .75 : -.72, g = .6 + .6 * Math.abs(Math.sin(te * 2.2 + k));
        v[0] = ox + (v[0] - ox) * g; v[1] = oy + (v[1] - oy) * g;
      } }; }
  };
  SHAPES.thread = SHAPES.helix;

  function Field(cv, opt){
    opt = opt || {};
    var ctx = cv.getContext('2d');
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var N = opt.N || (Math.min(innerWidth, innerHeight) < 600 ? 1000 : 1700);
    var cur = new Float32Array(N*3), from = new Float32Array(N*3), cc = new Float32Array(N*3), cf = new Float32Array(N*3), dl = new Float32Array(N);
    for(var i = 0; i < N; i++){ cur.set(inBall(2.6), i*3); cc.set(C.dim, i*3); dl[i] = hash(i + 7) * .5; }
    var F = { name:'', key:'', scene:null, data:null, t0:0, last:0, yaw:0, pitch:-.22, W:0, H:0,
              ax:0, ay:0, ar:0, aa:0, tx:0, ty:0, tr:0, ta:1, px:0, py:0, ptx:0, pty:0, mx:-1e4, my:-1e4, kick:0, raf:0 };
    var cache = {}, v = [0,0,0], c = [0,0,0];

    function place(snap){
      var a = (opt.anchor && opt.anchor(F.name)) || { x:F.W / 2, y:F.H / 2, r:Math.min(F.W, F.H) * .35 };
      F.tx = a.x; F.ty = a.y; F.tr = a.r; F.ta = a.a == null ? 1 : a.a;
      if(snap){ F.ax = F.tx; F.ay = F.ty; F.ar = F.tr; F.aa = F.ta; }
    }
    function size(){
      var d = Math.min(window.devicePixelRatio || 1, 2);
      F.W = innerWidth; F.H = innerHeight;
      cv.width = Math.max(1, F.W * d); cv.height = Math.max(1, F.H * d);
      ctx.setTransform(d, 0, 0, d, 0, 0);
      place(!F.ar);
      if(reduce) frame(performance.now());
    }

    function frame(now){
      var sc = F.scene, D = F.data; if(!sc || !F.W) return;
      var dt = Math.min(.05, (now - F.last) / 1000 || 0); F.last = now;
      var te = reduce ? 4 : (now - F.t0) / 1000, DUR = opt.dur || 1.5;
      place(reduce);
      var e = Math.min(1, dt * 3.2);
      F.ax += (F.tx - F.ax) * e; F.ay += (F.ty - F.ay) * e; F.ar += (F.tr - F.ar) * e; F.aa += (F.ta - F.aa) * e;
      if(sc.spin){ if(!reduce) F.yaw += sc.spin * dt * (1 + F.kick * 5); }
      else { var tg = Math.round(F.yaw / TAU) * TAU + (reduce ? 0 : Math.sin(te * .7) * .35); F.yaw += (tg - F.yaw) * Math.min(1, dt * 2.4); }
      F.px += (F.ptx - F.px) * .05; F.py += (F.pty - F.py) * .05;
      F.kick *= Math.pow(.05, dt);
      var yw = F.yaw + F.px * .5, cy = Math.cos(yw), sy = Math.sin(yw), pt = F.pitch + F.py * .25, cp = Math.cos(pt), sp = Math.sin(pt);
      var dist = 5, f = F.ar * dist, ox = F.ax, oy = F.ay, base = clamp(F.ar / 200, .8, 2.1) * (opt.pt || 1);
      var mx = F.mx, my = F.my, RR = 120, RR2 = RR * RR;
      ctx.globalCompositeOperation = 'source-over'; ctx.clearRect(0, 0, F.W, F.H);
      ctx.globalCompositeOperation = 'lighter';
      for(var i = 0; i < N; i++){
        var j = i * 3;
        v[0] = D.p[j]; v[1] = D.p[j+1]; v[2] = D.p[j+2]; c[0] = D.c[j]; c[1] = D.c[j+1]; c[2] = D.c[j+2];
        if(sc.anim) sc.anim(i, v, c, te, D);
        var k = reduce ? 1 : ease(clamp((te - dl[i] * DUR * .5) / (DUR * .7), 0, 1));
        var X = from[j] + (v[0] - from[j]) * k, Y = from[j+1] + (v[1] - from[j+1]) * k, Z = from[j+2] + (v[2] - from[j+2]) * k;
        var R = cf[j] + (c[0] - cf[j]) * k, G = cf[j+1] + (c[1] - cf[j+1]) * k, B = cf[j+2] + (c[2] - cf[j+2]) * k;
        cur[j] = X; cur[j+1] = Y; cur[j+2] = Z; cc[j] = R; cc[j+1] = G; cc[j+2] = B;
        if(F.kick > .002){ var g = 1 + F.kick * (.5 + hash(i) * .9); X *= g; Y *= g; Z *= g; }
        var x1 = X * cy - Z * sy, z1 = X * sy + Z * cy, y1 = Y * cp - z1 * sp, z2 = Y * sp + z1 * cp, d = z2 + dist;
        if(d <= .3) continue;
        var s = f / d, px = ox + x1 * s, py = oy - y1 * s;
        var dx = px - mx, dy = py - my, dd = dx * dx + dy * dy;
        if(dd < RR2 && dd > .01){ var q = Math.sqrt(dd), push = 1 - q / RR; push = push * push * 36; px += dx / q * push; py += dy / q * push; }
        var r = Math.max(.5, base * D.s[i] * dist / d), al = clamp(.95 - z2 * .16, .22, 1) * F.aa;
        ctx.fillStyle = 'rgba(' + (R | 0) + ',' + (G | 0) + ',' + (B | 0) + ',' + al.toFixed(3) + ')';
        if(r < 1.7) ctx.fillRect(px - r, py - r, r * 2, r * 2);
        else { ctx.beginPath(); ctx.arc(px, py, r, 0, TAU); ctx.fill(); }
      }
      ctx.globalCompositeOperation = 'source-over';
      if(opt.after) opt.after(F);
    }
    function loop(now){ if(F.stopped) return; frame(now); F.raf = requestAnimationFrame(loop); }

    F.set = function(name, tone){
      var key = name + '|' + (tone || '');
      if(F.key === key || !SHAPES[name]) return;
      var sc = cache[key];
      if(!sc){
        var base = name.split(':'), make = SHAPES[base[0]];
        sc = make(tone ? rgb(tone) : null, base[1]); sc.data = sc.build(N); cache[key] = sc;
      }
      from.set(cur); cf.set(cc);
      F.key = key; F.name = name; F.scene = sc; F.data = sc.data; F.t0 = performance.now();
      if(reduce) frame(F.t0);
    };

    F.reduce = reduce;
    F.stop = function(){ F.stopped = true; cancelAnimationFrame(F.raf); };

    size();
    addEventListener('resize', size);
    addEventListener('pointermove', function(e){
      if(e.pointerType !== 'mouse') return;
      F.mx = e.clientX; F.my = e.clientY;
      F.ptx = (e.clientX / F.W - .5) * 2; F.pty = (e.clientY / F.H - .5) * 2;
    }, { passive:true });
    document.addEventListener('pointerleave', function(){ F.mx = F.my = -1e4; F.ptx = F.pty = 0; });
    addEventListener('blur', function(){ F.mx = F.my = -1e4; });
    if(!reduce) F.raf = requestAnimationFrame(loop);
    return F;
  }

  /* lock, checking and open share one build, so register the variants */
  SHAPES['lock:checking'] = true; SHAPES['lock:open'] = true;
  return Field;
})();
</script>

<script>
/* ── conducting the field: which shape, where, and when ───────────────────
   Idle, it cycles through four shapes in the 4Cs. Hover a row and it becomes
   that page (a spade for poker, a helix for TrialThread) in the row's tone.
   Touch the password box and it becomes a lock: it spins while the gate
   checks, springs open on a match, and shudders apart on a miss.
   ──────────────────────────────────────────────────────────────────────── */
(function(){
  var cv = document.getElementById('field');
  if(!cv || !cv.getContext || typeof Field !== 'function') return;

  var stage = document.querySelector('.stage'), whoEl = document.getElementById('who'),
      pw = document.getElementById('whoPw'), board = document.getElementById('board'),
      find = document.getElementById('find'), dots = document.getElementById('dots'),
      tagEl = document.getElementById('fieldTag'), tagN = tagEl.firstChild, tagT = tagEl.lastChild;

  var TONE = { chill:'#9b8fff', caring:'#ff5f7e', gold:'#e8b84b', constructive:'#00e5a0', curious:'#f5c842' };
  var BY_ICON = { 'ic-8ball':'eightball', 'ic-spade':'spade', 'ic-compass':'compass',
                  'ic-sparkles':'sparkles', 'ic-thread':'thread' };
  var IDLE = [['rings','four Cs'], ['helix','the thread'], ['knot','tied together'], ['globe','the whole lot']];

  var mode = 'idle', cycle = 0, idleAt = 0, idleTone = null, busy = false,
      hoverEl = null, hoverRect = null, settle = 0, authTimer = 0, tagW = 0;

  function pad(n){ return (n < 10 ? '0' : '') + n; }

  /* where the shape sits: its own column on wide screens, behind the board otherwise */
  function anchor(){
    var W = innerWidth, H = innerHeight, st = stage.getBoundingClientRect(),
        gut = W - st.right, wide = gut >= 300, gx = st.right + gut / 2;
    if(mode === 'auth'){
      if(wide){ var w = whoEl.getBoundingClientRect();
        return { x:gx, y:Math.max(w.bottom + 120, H * .3), r:Math.min(gut * .26, 115), a:1 }; }
      return { x:W / 2, y:H * .5, r:Math.min(W, H) * .3, a:.6 };
    }
    if(mode === 'hover' && hoverRect && wide)
      return { x:gx, y:Math.min(Math.max(hoverRect.top + hoverRect.height / 2, H * .36), H * .64),
               r:Math.min(gut * .28, H * .2, 160), a:1 };
    if(wide) return { x:gx, y:H * .5, r:Math.min(gut * .34, H * .3), a:1 };
    return { x:W / 2, y:H * .58, r:Math.min(W, H) * .44, a:.4 };
  }

  var field = Field(cv, { anchor:anchor, after:function(F){
    var y = Math.min(F.ay + F.ar * 1.5 + 14, innerHeight - 40);
    tagEl.style.transform = 'translate(' + Math.round(F.ax - tagW / 2) + 'px,' + Math.round(y) + 'px)';
    tagEl.style.opacity = F.aa < .7 ? 0 : 1;
  }});

  function say(n, text, tone){
    tagN.textContent = n; tagT.textContent = text;
    tagEl.style.setProperty('--tag', tone || 'var(--muted)');
    tagW = tagEl.offsetWidth;
  }

  function idle(){
    clearTimeout(settle);
    mode = 'idle'; hoverEl = null;
    var i = cycle % IDLE.length;
    field.set(IDLE[i][0], idleTone); say(pad(i + 1), IDLE[i][1], idleTone);
    idleAt = performance.now();
  }
  setInterval(function(){
    if(mode === 'idle' && !field.reduce && !document.hidden && performance.now() - idleAt > 7500){ cycle++; idle(); }
  }, 500);

  /* ── a row under the pointer becomes its own shape ── */
  function hover(row){
    if(mode === 'auth' || row === hoverEl || row.classList.contains('is-notyours')) return;
    clearTimeout(settle);
    var use = row.querySelector('.r-icon use'), icon = use ? use.getAttribute('href').slice(1) : '',
        tm = /\bt-(\w+)/.exec(row.className), tone = TONE[tm && tm[1]] || TONE.chill;
    hoverEl = row; hoverRect = row.getBoundingClientRect(); mode = 'hover';
    field.set(BY_ICON[icon] || 'globe', tone); field.pulse(.15);
    say(row.querySelector('.r-num').textContent, row.querySelector('.r-title').dataset.text, tone);
  }
  function unhover(){
    clearTimeout(settle);
    settle = setTimeout(function(){ if(mode === 'hover') idle(); }, 450);
  }
  board.addEventListener('pointerover', function(e){
    var r = e.target.closest && e.target.closest('.row');
    if(r) hover(r); else if(mode === 'hover') unhover();
  });
  board.addEventListener('pointerleave', unhover);
  board.addEventListener('focusin', function(e){ var r = e.target.closest('.row'); if(r) hover(r); });
  board.addEventListener('focusout', unhover);
  board.addEventListener('scroll', function(){ if(hoverEl) hoverRect = hoverEl.getBoundingClientRect(); }, { passive:true });
  board.addEventListener('click', function(e){ if(e.target.closest('.row')) field.pulse(.9); });

  /* ── the password box turns the field into a lock ── */
  function auth(shape, n, text, tone){ clearTimeout(authTimer); clearTimeout(settle); mode = 'auth'; field.set(shape, tone); say(n, text, tone); }
  function flash(cls){
    whoEl.classList.remove('ok', 'bad'); void whoEl.offsetWidth; whoEl.classList.add(cls);
    setTimeout(function(){ whoEl.classList.remove(cls); }, 1400);
  }
  pw.addEventListener('focus', function(){ if(!busy) auth('lock', '··', 'locked', TONE.chill); });
  pw.addEventListener('input', function(){ field.pulse(.12); });
  pw.addEventListener('blur', function(){
    setTimeout(function(){ if(mode === 'auth' && !busy && document.activeElement !== pw) idle(); }, 250);
  });
  document.addEventListener('who-state', function(e){
    if(e.detail === 'checking'){ busy = true; auth('lock:checking', '··', 'checking', TONE.chill); return; }
    if(e.detail === 'ok'){
      auth('lock:open', '✓', 'open', TONE.constructive); field.pulse(.3); flash('ok');
      authTimer = setTimeout(function(){ busy = false; idle(); }, 2300);
      return;
    }
    auth('scatter', '×', 'not that one', TONE.caring); field.pulse(.6); flash('bad');
    authTimer = setTimeout(function(){
      busy = false;
      if(document.activeElement === pw) auth('lock', '··', 'locked', TONE.chill); else idle();
    }, 1500);
  });

  /* ── tabs tint the field, typing nudges it ── */
  document.addEventListener('board-tab', function(e){
    var g = ((window.CATALOGUE && CATALOGUE.groups) || []).filter(function(x){ return x.id === e.detail; })[0];
    idleTone = g ? TONE[g.tone] : null;
    field.pulse(.35);
    if(mode !== 'auth') idle();
  });
  find.addEventListener('input', function(){ field.pulse(.1); });
  dots.addEventListener('mouseenter', function(){ field.pulse(.45); });
  document.addEventListener('pointerdown', function(e){ if(e.pointerType !== 'mouse') field.pulse(.2); });

  if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ tagW = tagEl.offsetWidth; });
  idle();
})();
</script>
